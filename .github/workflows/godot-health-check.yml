name: Check Godot Windows Build

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 * * 1,4"

env:
  ISSUE_REPO: vvvvy531/myproject-source
  ISSUE_TITLE: Godot Windows Build Health

jobs:
  check:
    name: Check latest Godot Windows build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq scons pkg-config mingw-w64 libgl1-mesa-dev libglu1-mesa-dev jq
      - name: Detect latest Godot
        id: version
        run: |
          latest=$(curl -sS https://api.github.com/repos/godotengine/godot/releases/latest | jq -r '.tag_name')
          echo "version=$latest" >> "$GITHUB_OUTPUT"
      - name: Clone Godot
        run: |
          git clone --depth 1 --branch "${{ steps.version.outputs.version }}" https://github.com/godotengine/godot.git
      - name: Build Windows editor
        id: build
        continue-on-error: true
        working-directory: godot
        run: |
          scons -j$(nproc) platform=windows target=editor arch=x86_64 use_mingw=yes use_llvm=no use_static_cpp=yes LINKFLAGS="-static-libgcc -static-libstdc++" progress=no 2>&1 | tee ../build.log
          exit ${PIPESTATUS[0]}
      - name: Find or create issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          num=$(gh issue list -R "${{ env.ISSUE_REPO }}" --search "in:title ${{ env.ISSUE_TITLE }}" --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -z "$num" ]]; then
            num=$(gh issue create -R "${{ env.ISSUE_REPO }}" --title "${{ env.ISSUE_TITLE }}" --body "Godot Windows build health check" --label "build-health" --json number --jq '.number')
          fi
          echo "issue_number=$num" >> "$GITHUB_OUTPUT"
      - name: Report failure
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          NUM: ${{ steps.issue.outputs.issue_number }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          log=$(tail -100 build.log)
          gh issue comment "$NUM" -R "${{ env.ISSUE_REPO }}" --body "Build failed: $VER at $(date -u '+%Y-%m-%d %H:%M UTC')"
          gh issue reopen "$NUM" -R "${{ env.ISSUE_REPO }}" 2>/dev/null || true
      - name: Report success
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          NUM: ${{ steps.issue.outputs.issue_number }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          gh issue comment "$NUM" -R "${{ env.ISSUE_REPO }}" --body "Build passing: $VER at $(date -u '+%Y-%m-%d %H:%M UTC')"
