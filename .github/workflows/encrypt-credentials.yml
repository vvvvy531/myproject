name: Encrypt Review Credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Clone private repo artifacts branch
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          ARTIFACT_REPO: vvvvy531/myproject-linux-builds
        run: |
          set -euo pipefail
          git clone --depth 1 --branch linux-artifacts \
            "https://x-access-token:${GH_TOKEN}@github.com/${ARTIFACT_REPO}.git" \
            /tmp/artifacts

      - name: Encrypt unencrypted credential files
        env:
          AUTH_PASSWORD: ${{ secrets.CODERABBIT_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          cd /tmp/artifacts/review-auth
          cnt=0
          for f in num.*.tar.gz; do
            [[ "$f" == *.enc ]] && continue
            enc_file="${f}.enc"
            if [[ -f "$enc_file" ]]; then
              echo "SKIP (enc exists): $f"
              continue
            fi
            echo "ENCRYPTING: $f -> $enc_file"
            openssl enc -aes-256-cbc -pbkdf2 \
              -in "$f" \
              -out "$enc_file" \
              -pass pass:"$AUTH_PASSWORD"
            cnt=$((cnt + 1))
          done
          echo "Encrypted $cnt files"

      - name: Push encrypted files back
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          ARTIFACT_REPO: vvvvy531/myproject-linux-builds
        run: |
          set -euo pipefail
          cd /tmp/artifacts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add review-auth/
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "chore: encrypt remaining credential archives"
            git push origin linux-artifacts
            echo "Pushed encrypted files"
          fi