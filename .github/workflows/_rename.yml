name: Rename num23 to num22
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rename in artifact repo
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          ARTIFACT_REPO: vvvvy531/myproject-linux-builds
        run: |
          set -euo pipefail
          cd /tmp
          git clone --branch linux-artifacts \
            "https://x-access-token:${GH_TOKEN}@github.com/${ARTIFACT_REPO}.git" art
          cd art
          git config user.email "review-bot@users.noreply.github.com"
          git config user.name "Review Bot"
          git mv review-auth/num.23.tar.gz review-auth/num.22.tar.gz
          git mv review-auth/num.23.tar.gz.enc review-auth/num.22.tar.gz.enc
          git commit -m "chore: rename num.23 -> num.22 (21 accounts = 2-22)"
          git push origin linux-artifacts
          echo "RENAME_DONE"
          ls -la review-auth/num.22.*
