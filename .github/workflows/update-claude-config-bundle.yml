name: Update Claude Config Bundle

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  update-bundle:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CLI_IMAGE: ghcr.io/vvvvy531/claude-code-cli@sha256:3c1ac4c0e503064d4e35b65ddbe7ccba44f33a6dc432ca902776c9c5fa7092be
      BUILDS_REPO: vvvvy531/myproject-linux-builds
      BUNDLE_PATH: claude-config-bundle.tar.gz
    steps:
      - name: Checkout updater scripts
        uses: actions/checkout@v4

      - name: Download current bundle
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/claude-bundle.XXXXXX")"
          echo "tmpdir=$tmpdir" >> "$GITHUB_ENV"
          mkdir -p "$tmpdir/home" "$tmpdir/bundle"
          gh api -H 'Accept: application/vnd.github.raw' "repos/${BUILDS_REPO}/contents/${BUNDLE_PATH}?ref=main" > "$tmpdir/bundle/${BUNDLE_PATH}"
          tar -xzf "$tmpdir/bundle/${BUNDLE_PATH}" -C "$tmpdir/home"
          chmod -R a+rwX "$tmpdir/home"

      - name: Update Claude plugins
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker pull "$CLAUDE_CLI_IMAGE"
          docker run --rm             -v "$tmpdir/home:/home/claude"             -e HOME=/home/claude             "$CLAUDE_CLI_IMAGE"             plugin update --all

      - name: Rebuild sanitized bundle
        run: |
          set -euo pipefail
          chmod +x ci/claude-config-bundle/create-bundle.sh
          ci/claude-config-bundle/create-bundle.sh "$tmpdir/home" "$tmpdir/${BUNDLE_PATH}"
          sha256sum "$tmpdir/${BUNDLE_PATH}" | tee "$tmpdir/${BUNDLE_PATH}.sha256"

      - name: Upload updated bundle
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          set -euo pipefail
          content="$(base64 -w0 "$tmpdir/${BUNDLE_PATH}")"
          existing_sha="$(gh api "repos/${BUILDS_REPO}/contents/${BUNDLE_PATH}?ref=main" --jq '.sha')"
          jq -n             --arg message 'Update Claude config bundle after plugin refresh'             --arg content "$content"             --arg sha "$existing_sha"             --arg branch main             '{message: $message, content: $content, sha: $sha, branch: $branch}'             > "$tmpdir/update-bundle.json"
          commit_sha="$(gh api --method PUT "repos/${BUILDS_REPO}/contents/${BUNDLE_PATH}"             --input "$tmpdir/update-bundle.json" --jq '.commit.sha')"
          bundle_sha256="$(cut -d' ' -f1 "$tmpdir/${BUNDLE_PATH}.sha256")"
          echo "Updated ${BUILDS_REPO}@${commit_sha}"
          echo "Bundle sha256: ${bundle_sha256}"

