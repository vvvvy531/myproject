name: Qodo CLI Probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: vvvvy531/myproject-source
  REPORT_DIR: qodo-probe-report

jobs:
  qodo-probe:
    name: Qodo CLI OSS/trial probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Qodo CLI
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install -g @qodo/command

      - name: Checkout private source main
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          ref: main
          fetch-depth: 1
          lfs: false
          submodules: false
          path: source
          persist-credentials: false

      - name: Probe Qodo commands
        id: probe
        shell: bash
        run: |
          set +e
          mkdir -p "$REPORT_DIR"
          {
            echo '# Qodo CLI Probe'
            echo
            echo '## Versions'
            echo '```text'
            node --version
            npm --version
            qodo --version
            echo '```'
            echo
            echo '## qodo --help'
            echo '```text'
            qodo --help
            echo '```'
            echo
            echo '## qodo auth --help'
            echo '```text'
            qodo auth --help
            echo '```'
            echo
            echo '## qodo chat --help'
            echo '```text'
            qodo chat --help
            echo '```'
            echo
            echo '## minimal non-interactive attempt'
            echo '```text'
            timeout 120s qodo --help 2>&1
            echo '```'
          } > "$REPORT_DIR/qodo-probe.md" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write probe issue to source repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          title='Qodo CLI Probe'
          body_file="$REPORT_DIR/issue-body.md"
          cat > "$body_file" <<EOF
          # Qodo CLI Probe

          - Public run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source repo checkout: ${SOURCE_REPO}
          - Probe exit code: ${{ steps.probe.outputs.exit_code }}

          $(cat "$REPORT_DIR/qodo-probe.md")
          EOF
          issue="$(gh issue list -R "$SOURCE_REPO" --state all --search "$title in:title" --json number,title --jq '.[] | select(.title == "Qodo CLI Probe") | .number' | head -n 1)"
          if [[ -z "$issue" ]]; then
            gh issue create -R "$SOURCE_REPO" --title "$title" --body-file "$body_file" >/dev/null
          else
            gh issue edit "$issue" -R "$SOURCE_REPO" --body-file "$body_file"
            gh issue reopen "$issue" -R "$SOURCE_REPO" || true
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf source "$REPORT_DIR"
          rm -f ~/.git-credentials
          git config --global --unset-all credential.helper || true
