name: CodeRabbit Main Incremental Review

on:
  schedule:
    - cron: '0,20,40 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_REPO: vvvvy531/myproject-source
  ARTIFACT_REPO: vvvvy531/myproject-linux-builds
  AUTH_TAG: coderabbit-auth
  REPORT_DIR: coderabbit-report

jobs:
  coderabbit-incremental:
    name: CodeRabbit incremental main review
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Skip if full review is running
        id: full_guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          full_id="$(gh workflow list --repo "$GITHUB_REPOSITORY" --json id,name --jq '.[] | select(.name == "CodeRabbit Main Full Review") | .id' | head -n 1)"
          if [[ -z "$full_id" ]]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          count=0
          for s in in_progress queued waiting pending requested; do
            count=$((count + $(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$full_id" --status "$s" --json databaseId --jq 'length')))
          done
          if [[ "$count" -gt 0 ]]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout private source main
        if: steps.full_guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          ref: main
          fetch-depth: 0
          lfs: false
          submodules: recursive
          path: source
          persist-credentials: false

      - name: Install CodeRabbit CLI
        if: steps.full_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export CI=1
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore CodeRabbit auth
        if: steps.full_guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          CODERABBIT_AUTH_PASSWORD: ${{ secrets.CODERABBIT_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          gh release download "$AUTH_TAG" -R "$ARTIFACT_REPO" -p coderabbit-auth.tar.gz.enc -D /tmp --clobber
          openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/coderabbit-auth.tar.gz.enc -out /tmp/coderabbit-auth.tar.gz -pass pass:"$CODERABBIT_AUTH_PASSWORD"
          tar -xzf /tmp/coderabbit-auth.tar.gz -C "$HOME"
          rm -f /tmp/coderabbit-auth.tar.gz /tmp/coderabbit-auth.tar.gz.enc
          chmod 700 "$HOME/.coderabbit" || true

      - name: Determine incremental range from source issue state
        if: steps.full_guard.outputs.skip != 'true'
        id: range
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          head_sha="$(git -C source rev-parse HEAD)"
          root_sha="$(git -C source rev-list --max-parents=0 HEAD | tail -n 1)"
          state_title='CodeRabbit CLI State'
          issue="$(gh issue list -R "$SOURCE_REPO" --state all --search "$state_title in:title" --json number,title --jq '.[] | select(.title == "CodeRabbit CLI State") | .number' | head -n 1)"
          last_sha=""
          if [[ -n "$issue" ]]; then
            gh issue view "$issue" -R "$SOURCE_REPO" --json body --jq .body > /tmp/coderabbit-state-body.md || true
            last_sha="$(python3 - <<'PY'
          import json,re,pathlib
          s=pathlib.Path('/tmp/coderabbit-state-body.md').read_text(errors='ignore') if pathlib.Path('/tmp/coderabbit-state-body.md').exists() else ''
          m=re.search(r'```json\s*(\{.*?\})\s*```', s, re.S)
          print(json.loads(m.group(1)).get('last_completed_sha','') if m else '')
          PY
          )"
          fi
          if [[ -z "$last_sha" ]] || ! git -C source cat-file -e "$last_sha^{commit}" 2>/dev/null; then last_sha="$root_sha"; fi
          if [[ "$last_sha" == "$head_sha" ]]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
          echo "base_sha=$last_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$last_sha" > "$REPORT_DIR/base-sha.txt"
          printf '%s\n' "$head_sha" > "$REPORT_DIR/head-sha.txt"
          printf '%s\n' incremental > "$REPORT_DIR/mode.txt"

      - name: Run CodeRabbit CLI review
        if: steps.full_guard.outputs.skip != 'true' && steps.range.outputs.skip != 'true'
        shell: bash
        working-directory: source
        run: |
          set +x
          coderabbit review --agent --base-commit "${{ steps.range.outputs.base_sha }}" > "../$REPORT_DIR/coderabbit-review.jsonl"

      - name: Summarize findings
        if: always() && steps.full_guard.outputs.skip != 'true' && steps.range.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,collections
          report=pathlib.Path('coderabbit-report'); findings=[]; src=report/'coderabbit-review.jsonl'
          if src.exists():
            for line in src.read_text(encoding='utf-8',errors='replace').splitlines():
              try: obj=json.loads(line)
              except Exception: continue
              if obj.get('type')=='finding': findings.append(obj)
          c=collections.Counter(f.get('severity','unknown') for f in findings)
          lines=['# CodeRabbit Incremental Main Review','',f'- Base: {(report/"base-sha.txt").read_text().strip()}',f'- Head: {(report/"head-sha.txt").read_text().strip()}',f'- Findings: {len(findings)}',f'- Critical: {c.get("critical",0)}',f'- Major: {c.get("major",0)}',f'- Minor: {c.get("minor",0)}','','## Top findings','']
          for f in findings[:30]: lines.append(f'- **{f.get("severity","unknown")}** `{f.get("fileName","")}`: {str(f.get("message") or f.get("title") or f.get("codegenInstructions") or "").replace(chr(10)," ")[:300]}')
          (report/'coderabbit-summary.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Upsert report issue in source repo
        if: always() && steps.full_guard.outputs.skip != 'true' && steps.range.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          title='CodeRabbit Incremental Main Review'
          body_file="$REPORT_DIR/issue-body.md"
          cat > "$body_file" <<EOF
          # CodeRabbit Incremental Main Review

          - Public run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source repo: ${SOURCE_REPO}

          $(cat "$REPORT_DIR/coderabbit-summary.md")
          EOF
          issue="$(gh issue list -R "$SOURCE_REPO" --state all --search "$title in:title" --json number,title --jq '.[] | select(.title == "CodeRabbit Incremental Main Review") | .number' | head -n 1)"
          if [[ -z "$issue" ]]; then gh issue create -R "$SOURCE_REPO" --title "$title" --body-file "$body_file" >/dev/null; else gh issue edit "$issue" -R "$SOURCE_REPO" --body-file "$body_file"; gh issue reopen "$issue" -R "$SOURCE_REPO" || true; fi

      - name: Upsert state issue in source repo
        if: success() && steps.full_guard.outputs.skip != 'true' && steps.range.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          title='CodeRabbit CLI State'
          body_file="$REPORT_DIR/state-issue-body.md"
          cat > "$body_file" <<EOF
          # CodeRabbit CLI State

          Do not edit unless resetting CodeRabbit incremental range.

          ```json
          {"last_completed_sha":"${{ steps.range.outputs.head_sha }}","base_sha":"${{ steps.range.outputs.base_sha }}","mode":"incremental","run_id":"${GITHUB_RUN_ID}","updated_at":"$(date -u +%FT%TZ)"}
          ```
          EOF
          issue="$(gh issue list -R "$SOURCE_REPO" --state all --search "$title in:title" --json number,title --jq '.[] | select(.title == "CodeRabbit CLI State") | .number' | head -n 1)"
          if [[ -z "$issue" ]]; then gh issue create -R "$SOURCE_REPO" --title "$title" --body-file "$body_file" >/dev/null; else gh issue edit "$issue" -R "$SOURCE_REPO" --body-file "$body_file"; gh issue reopen "$issue" -R "$SOURCE_REPO" || true; fi

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf source "$HOME/.coderabbit" "$REPORT_DIR"
          rm -f ~/.git-credentials
          git config --global --unset-all credential.helper || true
