name: Private Source Linux Build

"on":
  workflow_dispatch:
  repository_dispatch:
    types: [linux-build]

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  SOURCE_REPO: vvvvy531/myproject-source
  ARTIFACT_REPO: vvvvy531/myproject-linux-builds
  PROJECT_FILE: MyProject.uproject
  TARGET_NAME: MyProject
  UE_IMAGE: ghcr.io/epicgames/unreal-engine:dev-slim-5.7.4

jobs:
  build-linux:
    name: UE 5.7.4 Linux smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free hosted runner disk
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Start UE image pull in background
        shell: bash
        run: |
          set -euo pipefail
          nohup bash -lc 'docker pull "$UE_IMAGE" > /tmp/ue-image-pull.log 2>&1' & echo $! > /tmp/ue-image-pull.pid
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          lfs: false
          submodules: recursive

      - name: Prepare output directory
        shell: bash
        run: mkdir -p dist .sccache-cache .build-cache-restore .build-cache-restore


      # Public actions/cache intentionally avoids private source build products.
      # Compiler/object caches live only in private release assets requiring ARTIFACT_REPO_TOKEN.
      - name: Restore sccache compiler cache from private builds repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ARTIFACT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cache_tag="sccache-${{ runner.os }}"
          mkdir -p .sccache-cache .cache-restore
          if gh release download "$cache_tag" -R "$ARTIFACT_REPO" -p sccache-cache.tar.zst -D .cache-restore --clobber; then
            tar --zstd -xf .cache-restore/sccache-cache.tar.zst -C .sccache-cache || true
            du -sh .sccache-cache || true
          else
            echo "No private sccache cache release yet: $cache_tag"
          fi


      - name: Restore UE build products cache from private builds repo
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ARTIFACT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cache_tag="linux-build-cache-${{ runner.os }}"
          mkdir -p .build-cache-restore
          if gh release download "$cache_tag" -R "$ARTIFACT_REPO" -p ue-build-products.tar.zst -D .build-cache-restore --clobber; then
            tar --zstd -xf .build-cache-restore/ue-build-products.tar.zst -C source || true
            du -sh source/Binaries source/Intermediate source/Plugins/*/Binaries source/Plugins/*/Intermediate 2>/dev/null || true
          else
            echo "No private UE build-products cache release yet: $cache_tag"
          fi

      - name: Build Linux target in official UE container
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          if [[ -f /tmp/ue-image-pull.pid ]]; then
            pull_pid="$(cat /tmp/ue-image-pull.pid)"
            while kill -0 "$pull_pid" 2>/dev/null; do sleep 5; done
            cat /tmp/ue-image-pull.log || true
            docker image inspect "$UE_IMAGE" >/dev/null 2>&1 || docker pull "$UE_IMAGE"
          else
            docker pull "$UE_IMAGE"
          fi
          docker image ls "$UE_IMAGE"
          df -h
          docker run --rm --user root \
            -e PROJECT_FILE="$PROJECT_FILE" \
            -e TARGET_NAME="$TARGET_NAME" \
            -e GITHUB_RUN_NUMBER="$GITHUB_RUN_NUMBER" \
            -v "$PWD/source:/workspace/source" \
            -v "$PWD/dist:/workspace/dist" \
            -v "$PWD/.sccache-cache:/workspace/.sccache-cache" \
            -w /workspace/source \
            "$UE_IMAGE" \
            bash -lc '
              set -o pipefail
              mkdir -p ../dist
              if ! command -v zstd >/dev/null 2>&1; then apt-get update && apt-get install -y zstd; fi
              if ! command -v sccache >/dev/null 2>&1; then
                curl -L https://github.com/mozilla/sccache/releases/download/v0.15.0/sccache-v0.15.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/sccache.tar.gz
                tar -xzf /tmp/sccache.tar.gz -C /tmp
                install /tmp/sccache-v0.15.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
              fi
              if [[ ! -x /home/ue4/UnrealEngine/Engine/Source/ThirdParty/Intel/ISPC/bin/Linux/ispc ]]; then
                ispc_version="v1.30.0"
                curl -fsSL "https://github.com/ispc/ispc/releases/download/${ispc_version}/ispc-${ispc_version}-linux.tar.gz" -o /tmp/ispc.tar.gz
                tar -xzf /tmp/ispc.tar.gz -C /tmp
                mkdir -p /home/ue4/UnrealEngine/Engine/Source/ThirdParty/Intel/ISPC/bin/Linux
                ln -sf "/tmp/ispc-${ispc_version}-linux/bin/ispc" /home/ue4/UnrealEngine/Engine/Source/ThirdParty/Intel/ISPC/bin/Linux/ispc
              fi
              if ! command -v flatc >/dev/null 2>&1; then apt-get update && apt-get install -y flatbuffers-compiler; fi
              mkdir -p Plugins/FlatBuffers/Tools/flatc Plugins/FlatBuffers/Tools/include
              install -m 755 "$(command -v flatc)" Plugins/FlatBuffers/Tools/flatc/flatc || true
              install -m 755 "$(command -v flatc)" Plugins/FlatBuffers/Tools/flatc/flatc.exe || true
              mkdir -p "/home/ue4/.config/Unreal Engine/UnrealBuildTool" "/home/ue4/.config/Epic/UnrealBuildTool"
              printf "%s\n" \
                "<?xml version=\"1.0\" encoding=\"utf-8\"?>" \
                "<Configuration xmlns=\"https://www.unrealengine.com/BuildConfiguration\">" \
                "  <BuildConfiguration>" \
                "    <bUseUnityBuild>true</bUseUnityBuild>" \
                "    <bUseAdaptiveUnityBuild>true</bUseAdaptiveUnityBuild>" \
                "    <bAdaptiveUnityDisablesOptimizations>true</bAdaptiveUnityDisablesOptimizations>" \
                "    <bAdaptiveUnityDisablesPCH>true</bAdaptiveUnityDisablesPCH>" \
                "  </BuildConfiguration>" \
                "</Configuration>" > /tmp/BuildConfiguration.xml
              cp /tmp/BuildConfiguration.xml "/home/ue4/.config/Unreal Engine/UnrealBuildTool/BuildConfiguration.xml"
              cp /tmp/BuildConfiguration.xml "/home/ue4/.config/Epic/UnrealBuildTool/BuildConfiguration.xml"
              export SCCACHE_DIR=/workspace/.sccache-cache SCCACHE_CACHE_SIZE=8G SCCACHE_BASEDIRS=/workspace/source SCCACHE_IGNORE_SERVER_IO_ERROR=1
              printf "%s" "" | base64 -d > /usr/local/bin/sccache-rsp-wrapper
              chmod +x /usr/local/bin/sccache-rsp-wrapper
              export UE_SCCACHE_EXECUTABLE=/usr/local/bin/sccache-rsp-wrapper CCACHE_EXEC=/usr/local/bin/sccache-rsp-wrapper
              clangxx_path="$(find /home/ue4/UnrealEngine/Engine/Extras/ThirdPartyNotUE/SDKs/HostLinux -path "*/x86_64-unknown-linux-gnu/bin/clang++" | head -n 1)"
              echo "sccache clang++ candidate: ${clangxx_path:-<none>}"
              if [[ -n "$clangxx_path" ]]; then
                toolchain_bin="$(dirname "$clangxx_path")"
                for compiler in clang clang++; do
                  if [[ -e "$toolchain_bin/$compiler" && ! -e "$toolchain_bin/$compiler.real" ]]; then
                    mv "$toolchain_bin/$compiler" "$toolchain_bin/$compiler.real"
                    printf "%s" "" | base64 -d > "$toolchain_bin/$compiler"
                    chmod +x "$toolchain_bin/$compiler"
                    echo "wrapped $toolchain_bin/$compiler -> sccache with rsp expansion"
                  fi
                done
              fi
              sccache --stop-server || true
              sccache --start-server || true
              set +e
              /home/ue4/UnrealEngine/Engine/Build/BatchFiles/Linux/Build.sh "$TARGET_NAME" Linux Development "$PWD/$PROJECT_FILE" -WaitMutex -NoHotReload -NoUBA -MaxParallelActions=4 -VeryVerbose 2>&1 | tee ../dist/build.log
              code=${PIPESTATUS[0]}
              set -e
              if grep -q "Result: Failed" ../dist/build.log; then code=1; fi
              sccache --show-stats > ../dist/sccache-stats.txt 2>&1 || true
              du -sh "$SCCACHE_DIR" >> ../dist/sccache-stats.txt 2>&1 || true
              cp /home/ue4/.config/Epic/UnrealBuildTool/Log.txt ../dist/ubt.log 2>/dev/null || true
              find Intermediate -type f \( -name "*.log" -o -name "*.txt" -o -name "*.err" -o -name "*.response" -o -name "*.rsp" \) -print > ../dist/intermediate-diagnostics-files.txt 2>/dev/null || true
              tar -czf ../dist/intermediate-diagnostics.tar.gz -T ../dist/intermediate-diagnostics-files.txt 2>/dev/null || true
              tar -czf "../dist/MyProject-Linux-${GITHUB_RUN_NUMBER:-0}.tar.gz" Binaries Saved Intermediate/Build Plugins/*/Binaries Plugins/*/Intermediate 2>/dev/null || true
              printf "%s\n" "$code" > ../dist/build-exit-code.txt
              exit 0
            '
          code="$(cat dist/build-exit-code.txt 2>/dev/null || echo 1)"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Save sccache compiler cache to private builds repo
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ARTIFACT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cache_tag="sccache-${{ runner.os }}"
          mkdir -p dist
          du -sh .sccache-cache > dist/sccache-cache-size.txt 2>&1 || true
          tar --zstd -cf dist/sccache-cache.tar.zst -C .sccache-cache . || true
          if [[ -s dist/sccache-cache.tar.zst ]]; then
            gh release view "$cache_tag" -R "$ARTIFACT_REPO" >/dev/null 2>&1 \
              || gh release create "$cache_tag" -R "$ARTIFACT_REPO" --title "$cache_tag compiler cache" --notes "Rolling sccache compiler cache for Linux CI" --latest=false
            gh release upload "$cache_tag" -R "$ARTIFACT_REPO" dist/sccache-cache.tar.zst dist/sccache-cache-size.txt --clobber
          fi


      - name: Save UE build products cache to private builds repo
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ARTIFACT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cache_tag="linux-build-cache-${{ runner.os }}"
          mkdir -p dist
          (
            cd source
            tar --zstd -cf ../dist/ue-build-products.tar.zst \
              Binaries Intermediate Saved/UnrealBuildTool \
              Plugins/*/Binaries Plugins/*/Intermediate \
              2>/dev/null || true
          )
          du -sh dist/ue-build-products.tar.zst > dist/ue-build-products-size.txt 2>&1 || true
          if [[ -s dist/ue-build-products.tar.zst ]]; then
            gh release view "$cache_tag" -R "$ARTIFACT_REPO" >/dev/null 2>&1 \
              || gh release create "$cache_tag" -R "$ARTIFACT_REPO" --title "$cache_tag UE build products" --notes "Rolling UE Binaries/Intermediate cache for Linux CI" --latest=false
            gh release upload "$cache_tag" -R "$ARTIFACT_REPO" dist/ue-build-products.tar.zst dist/ue-build-products-size.txt --clobber
          fi

      - name: Write manifest
        if: always()
        shell: bash
        run: |
          build_exit_code="${{ steps.build.outputs.exit_code }}"
          [[ -n "$build_exit_code" ]] || build_exit_code="$(cat dist/build-exit-code.txt 2>/dev/null || echo 1)"
          BUILD_EXIT_CODE="$build_exit_code" python3 -c 'import json, os; json.dump({"sourceRepo": os.environ["SOURCE_REPO"], "runId": os.environ["GITHUB_RUN_ID"], "runNumber": os.environ["GITHUB_RUN_NUMBER"], "target": os.environ["TARGET_NAME"], "platform": "Linux", "configuration": "Development", "buildExitCode": os.environ["BUILD_EXIT_CODE"]}, open("dist/manifest.json", "w", encoding="utf-8"), indent=2)'

      - name: Drop empty artifacts
        if: always()
        shell: bash
        run: find dist -type f -size 0 -delete 2>/dev/null || true

      - name: Publish private release with logs
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.ARTIFACT_REPO }}
          token: ${{ secrets.ARTIFACT_REPO_TOKEN }}
          tag_name: linux-${{ github.run_number }}
          name: Linux build ${{ github.run_number }}
          body: |
            Source: `${{ env.SOURCE_REPO }}`
            Run: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            Build exit code: `${{ steps.build.outputs.exit_code }}`
          files: |
            dist/MyProject-Linux-*.tar.gz
            dist/manifest.json
            dist/build.log
            dist/sccache-stats.txt
            dist/build-exit-code.txt
            dist/ubt.log
            dist/intermediate-diagnostics-files.txt
            dist/intermediate-diagnostics.tar.gz
          fail_on_unmatched_files: false
          draft: false
          overwrite_files: true

      - name: Fail job if build failed
        if: ${{ steps.build.outputs.exit_code != '0' }}
        shell: bash
        run: exit 1







