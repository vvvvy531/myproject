name: Recover and verify num.1 credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install CodeRabbit CLI
        run: |
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download credentials
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          ARTIFACT_REPO: vvvvy531/myproject-linux-builds
        run: |
          set -euo pipefail
          # Original num.1 (before sync corruption)
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/review-auth/num.1.tar.gz.enc?ref=5702b54" \
            > /tmp/num1-orig.tar.gz.enc
          echo "Original num.1.enc size: $(stat -c%s /tmp/num1-orig.tar.gz.enc)"

          # Current num.2.enc (known working, to test password)
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/review-auth/num.2.tar.gz.enc?ref=linux-artifacts" \
            > /tmp/num2-current.tar.gz.enc
          echo "Current num.2.enc size: $(stat -c%s /tmp/num2-current.tar.gz.enc)"

      - name: Test password on num.2 first
        env:
          AUTH_PASSWORD: ${{ secrets.CODERABBIT_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          echo "=== Testing password on num.2.tar.gz.enc ==="
          if openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/num2-current.tar.gz.enc \
            -out /tmp/num2-test.tar.gz \
            -pass pass:"$AUTH_PASSWORD" 2>&1; then
            echo "num.2 decrypt: OK (size=$(stat -c%s /tmp/num2-test.tar.gz))"
          else
            echo "num.2 decrypt: FAILED"
          fi

          echo ""
          echo "=== Testing password on original num.1.tar.gz.enc ==="
          if openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/num1-orig.tar.gz.enc \
            -out /tmp/num1-orig.tar.gz \
            -pass pass:"$AUTH_PASSWORD" 2>&1; then
            echo "num.1 decrypt: OK (size=$(stat -c%s /tmp/num1-orig.tar.gz))"
            echo "Archive contents:"
            tar -tzf /tmp/num1-orig.tar.gz
          else
            echo "num.1 decrypt: FAILED - password may have changed since original encryption"
            echo ""
            echo "=== Trying to use current num.1.enc instead ==="
            # The current num.1.enc was re-encrypted by sync with current password
            # But it has the .review-cli bug. Let's decrypt it and fix the structure.
            echo "Downloading current num.1.tar.gz.enc..."
          fi

      - name: Fallback - decrypt current num.1 and fix structure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          AUTH_PASSWORD: ${{ secrets.CODERABBIT_AUTH_PASSWORD }}
          ARTIFACT_REPO: vvvvy531/myproject-linux-builds
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          # Download current num.1.enc
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/review-auth/num.1.tar.gz.enc?ref=linux-artifacts" \
            > /tmp/num1-current.tar.gz.enc
          echo "Current num.1.enc size: $(stat -c%s /tmp/num1-current.tar.gz.enc)"

          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/num1-current.tar.gz.enc \
            -out /tmp/num1-current.tar.gz \
            -pass pass:"$AUTH_PASSWORD"

          echo "Current num.1 archive contents:"
          tar -tzf /tmp/num1-current.tar.gz

          # Extract and check structure
          mkdir -p /tmp/test-extract
          tar -xzf /tmp/num1-current.tar.gz -C /tmp/test-extract
          echo "Extracted:"
          find /tmp/test-extract -maxdepth 2 -type f -o -type l | head -20

          # Fix: if .review-cli exists but .coderabbit doesn't, rename
          if [ -d "/tmp/test-extract/.review-cli" ] && [ ! -d "/tmp/test-extract/.coderabbit" ]; then
            echo "Fixing: .review-cli -> .coderabbit"
            mv /tmp/test-extract/.review-cli /tmp/test-extract/.coderabbit
          fi

          # Copy to HOME and test
          cp -r /tmp/test-extract/.coderabbit "$HOME/.coderabbit"
          chmod 700 "$HOME/.coderabbit"

          echo "=== auth.json ==="
          python3 -c "
          import json
          d = json.load(open('$HOME/.coderabbit/auth.json'))
          print(f'  expiresAt: {d.get(\"expiresAt\", \"?\")}')
          print(f'  user: {d.get(\"user\",{}).get(\"user_name\",\"?\")}')
          " 2>/dev/null || echo "  auth.json NOT FOUND"

          echo "=== Auth status ==="
          coderabbit auth status 2>&1 || true
