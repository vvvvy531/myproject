name: Recover and verify num.1 credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install CodeRabbit CLI
        run: |
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Recover original num.1 credential from history
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          ARTIFACT_REPO: vvvvy531/myproject-linux-builds
        run: |
          set -euo pipefail
          # Get original num.1.tar.gz.enc from before sync corruption (June 4th, commit 5702b54)
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/review-auth/num.1.tar.gz.enc?ref=5702b54" \
            > /tmp/num1-orig.tar.gz.enc
          echo "Encrypted file size: $(ls -la /tmp/num1-orig.tar.gz.enc | awk '{print $5}')"

      - name: Decrypt and test credential
        env:
          AUTH_PASSWORD: ${{ secrets.CODERABBIT_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"

          # Decrypt
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/num1-orig.tar.gz.enc \
            -out /tmp/num1-orig.tar.gz \
            -pass pass:"$AUTH_PASSWORD"
          echo "Decrypted size: $(ls -la /tmp/num1-orig.tar.gz | awk '{print $5}')"

          # Show archive contents
          echo "=== Archive contents ==="
          tar -tzf /tmp/num1-orig.tar.gz

          # Extract to HOME
          tar -xzf /tmp/num1-orig.tar.gz -C "$HOME"
          chmod 700 "$HOME/.coderabbit" 2>/dev/null || true

          # Show auth.json (redacted)
          echo "=== auth.json (redacted) ==="
          if [ -f "$HOME/.coderabbit/auth.json" ]; then
            python3 -c "
          import json
          d = json.load(open('$HOME/.coderabbit/auth.json'))
          print(f'  expiresAt: {d.get(\"expiresAt\", \"?\")}')
          print(f'  provider: {d.get(\"provider\", \"?\")}')
          u = d.get('user', {})
          print(f'  user: {u.get(\"user_name\", \"?\")}')
          print(f'  email: {u.get(\"email\", \"?\")}')
          "
          else
            echo "  auth.json NOT FOUND!"
            ls -la "$HOME/.coderabbit/" 2>/dev/null || true
            ls -la "$HOME/.review-cli/" 2>/dev/null || true
          fi

          # Test auth status
          echo "=== CodeRabbit auth status ==="
          coderabbit auth status 2>&1 || true

          # Create a test repo and try a review
          mkdir -p /tmp/test-repo && cd /tmp/test-repo
          git init && git config user.email "test@test.com" && git config user.name "Test"
          echo "int main() { return 0; }" > test.cpp
          git add . && git commit -m "initial"
          BASE=$(git rev-parse HEAD)
          echo "new line" >> test.cpp
          git add . && git commit -m "second"
          git config coderabbit.baseBranch main

          echo "=== Review test ==="
          timeout 90 coderabbit review --dir . --base main --base-commit "$BASE" --agent 1>/tmp/review-out.jsonl 2>/tmp/review-err.log
          rc=$?
          echo "Exit code: $rc"
          echo "--- stderr ---"
          cat /tmp/review-err.log 2>/dev/null || true
          echo "--- stdout (first 300 chars) ---"
          head -c 300 /tmp/review-out.jsonl 2>/dev/null || true

      - name: Upload recovered credential as num.23
        if: success()
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          AUTH_PASSWORD: ${{ secrets.CODERABBIT_AUTH_PASSWORD }}
          ARTIFACT_REPO: vvvvy531/myproject-linux-builds
        run: |
          set -euo pipefail

          # Clone artifact repo
          cd /tmp
          git clone --depth 1 --branch linux-artifacts \
            "https://x-access-token:${GH_TOKEN}@github.com/${ARTIFACT_REPO}.git" artifacts
          cd artifacts
          git config user.email "review-bot@users.noreply.github.com"
          git config user.name "Review Bot"

          # Save plain .tar.gz
          cp /tmp/num1-orig.tar.gz review-auth/num.23.tar.gz

          # Save encrypted .tar.gz (re-encrypt with same password)
          openssl enc -e -aes-256-cbc -pbkdf2 \
            -in /tmp/num1-orig.tar.gz \
            -out review-auth/num.23.tar.gz.enc \
            -pass pass:"$AUTH_PASSWORD"

          git add review-auth/num.23.tar.gz review-auth/num.23.tar.gz.enc
          git commit -m "chore: recover original num.1 credential as num.23"
          git push origin linux-artifacts
          echo "UPLOAD_DONE"
