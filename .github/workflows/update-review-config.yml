name: Update Review Plugins Bundle

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

env:
  ARTIFACT_REPO: vvvvy531/myproject-linux-builds

jobs:
  update-claude-bundle:
    name: Update Claude plugins bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code 2>&1 | tail -5
          claude --version

      - name: Configure Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.REVIEW_PROXY_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.REVIEW_PROXY_URL }}
        run: |
          mkdir -p "$HOME/.claude"
          echo "API configured for plugin operations"

      - name: Download current bundle
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/review-config-bundle.tar.gz?ref=main" \
            > /tmp/current-bundle.tar.gz 2>/dev/null || true
          if [[ -s /tmp/current-bundle.tar.gz ]]; then
            mkdir -p /tmp/bundle-home
            tar -xzf /tmp/current-bundle.tar.gz -C /tmp/bundle-home 2>/dev/null || true
            # Restore existing plugins to HOME for update
            if [[ -d /tmp/bundle-home/.claude ]]; then
              cp -a /tmp/bundle-home/.claude/* "$HOME/.claude/" 2>/dev/null || true
            fi
            if [[ -d /tmp/bundle-home/.local ]]; then
              mkdir -p "$HOME/.local"
              cp -a /tmp/bundle-home/.local/* "$HOME/.local/" 2>/dev/null || true
            fi
            echo "Current bundle restored"
          fi

      - name: Update Claude plugins
        env:
          ANTHROPIC_API_KEY: ${{ secrets.REVIEW_PROXY_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.REVIEW_PROXY_URL }}
          CLAUDE_MODEL: ${{ secrets.REVIEW_MODEL || 'latest-sonnet' }}
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_SKIP_ONBOARDING: "1"
        run: |
          set +e
          # List and update all installed plugins
          claude plugin list --json 2>/dev/null > /tmp/plugins.json || true
          if [[ -s /tmp/plugins.json ]]; then
            jq -r '.[] | select(.scope == "user" or .scope == "project") | [.id, .scope] | @tsv' /tmp/plugins.json 2>/dev/null | \
              while IFS=$'\t' read -r plugin_id plugin_scope; do
                echo "Updating plugin: $plugin_id (scope: $plugin_scope)"
                claude plugin update "$plugin_id" --scope "$plugin_scope" 2>&1 || true
              done
          fi
          echo "Claude plugins updated"

      - name: Package Claude bundle
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          set -euo pipefail
          # Download create-bundle.sh from private repo
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/ci-scripts/create-bundle.sh?ref=main" \
            > /tmp/create-bundle.sh
          bash /tmp/create-bundle.sh "$HOME" /tmp/review-config-bundle.tar.gz
          echo "Claude bundle size: $(ls -lh /tmp/review-config-bundle.tar.gz | awk '{print $5}')"

      - name: Upload Claude bundle
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          set -euo pipefail
          B64=$(base64 -w0 /tmp/review-config-bundle.tar.gz)
          EXISTING_SHA=$(gh api "repos/${ARTIFACT_REPO}/contents/review-config-bundle.tar.gz?ref=main" --jq '.sha' 2>/dev/null || echo "")
          BODY=$(jq -n \
            --arg msg "chore: update claude review bundle $(date -u +%Y-%m-%d)" \
            --arg content "$B64" \
            --arg sha "$EXISTING_SHA" \
            '{message: $msg, content: $content, sha: (if $sha != "" then $sha else null end)}')
          echo "$BODY" > /tmp/upload-claude.json
          gh api --method PUT "repos/${ARTIFACT_REPO}/contents/review-config-bundle.tar.gz" \
            --input /tmp/upload-claude.json --jq '.commit.sha'
          echo "Claude bundle uploaded"

  update-codex-bundle:
    name: Update Codex plugins bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          codex --version

      - name: Install plugins
        env:
          OPENAI_API_KEY: ${{ secrets.REVIEW_PROXY_KEY }}
        run: |
          codex plugin add superpowers@openai-curated 2>&1 || true
          codex plugin add codex-security@openai-curated 2>&1 || true

      - name: Package Codex bundle
        run: |
          cd $HOME
          tar -czf /tmp/codex-review-bundle.tar.gz \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=__pycache__ \
            --exclude=.staging \
            .codex/config.toml \
            .codex/version.json \
            .codex/installation_id \
            .codex/skills/ \
            .codex/.tmp/marketplaces/ \
            .codex/.tmp/plugins/plugins/superpowers/ \
            .codex/.tmp/plugins/plugins/codex-security/ \
            .codex/.tmp/plugins/.agents/ \
            2>/dev/null
          echo "Codex bundle size: $(ls -lh /tmp/codex-review-bundle.tar.gz | awk '{print $5}')"

      - name: Upload Codex bundle
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          set -euo pipefail
          B64=$(base64 -w0 /tmp/codex-review-bundle.tar.gz)
          EXISTING_SHA=$(gh api "repos/${ARTIFACT_REPO}/contents/ci-scripts/codex-review-bundle.tar.gz?ref=main" --jq '.sha' 2>/dev/null || echo "")
          BODY=$(jq -n \
            --arg msg "chore: update codex review bundle $(date -u +%Y-%m-%d)" \
            --arg content "$B64" \
            --arg sha "$EXISTING_SHA" \
            '{message: $msg, content: $content, sha: (if $sha != "" then $sha else null end)}')
          echo "$BODY" > /tmp/upload-codex.json
          gh api --method PUT "repos/${ARTIFACT_REPO}/contents/ci-scripts/codex-review-bundle.tar.gz" \
            --input /tmp/upload-codex.json --jq '.commit.sha'
          echo "Codex bundle uploaded"