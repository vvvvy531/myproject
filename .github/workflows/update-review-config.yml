name: Update Review Config Bundle

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  update-bundle:
    runs-on: ubuntu-latest
    env:
      REVIEW_AI_IMAGE: ${{ secrets.REVIEW_AI_IMAGE }}
      BUILDS_REPO: vvvvy531/myproject-linux-builds
      BUNDLE_PATH: review-config-bundle.tar.gz
    steps:
      - name: Checkout updater scripts
        uses: actions/checkout@v4

      - name: Download current bundle
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/review-bundle.XXXXXX")"
          echo "tmpdir=$tmpdir" >> "$GITHUB_ENV"
          mkdir -p "$tmpdir/home" "$tmpdir/bundle"
          gh api -H 'Accept: application/vnd.github.raw' "repos/${BUILDS_REPO}/contents/${BUNDLE_PATH}?ref=main" > "$tmpdir/bundle/${BUNDLE_PATH}"
          tar -xzf "$tmpdir/bundle/${BUNDLE_PATH}" -C "$tmpdir/home"
          chmod -R a+rwX "$tmpdir/home"

      - name: Update plugins
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker pull "$REVIEW_AI_IMAGE"
          docker run --rm \
            -v "$tmpdir/home:/home/boxd" \
            -e HOME=/home/boxd \
            "$REVIEW_AI_IMAGE" \
            plugin list --json > "$tmpdir/plugins.json"
          jq -r '.[] | select(.scope == "user" or .scope == "project") | [.id, .scope] | @tsv' "$tmpdir/plugins.json" | while IFS=$'\t' read -r plugin_id plugin_scope; do
            docker run --rm \
              -v "$tmpdir/home:/home/boxd" \
              -e HOME=/home/boxd \
              "$REVIEW_AI_IMAGE" \
              plugin update "$plugin_id" --scope "$plugin_scope"
          done

      - name: Rebuild sanitized bundle
        run: |
          set -euo pipefail
          chmod +x ci/review-config-bundle/create-bundle.sh
          ci/review-config-bundle/create-bundle.sh "$tmpdir/home" "$tmpdir/${BUNDLE_PATH}"
          sha256sum "$tmpdir/${BUNDLE_PATH}" | tee "$tmpdir/${BUNDLE_PATH}.sha256"

      - name: Upload updated bundle
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          set -euo pipefail
          existing_sha="$(gh api "repos/${BUILDS_REPO}/contents/${BUNDLE_PATH}?ref=main" --jq '.sha')"
          python3 -c "import base64,json,sys; p,s=sys.argv[1:3]; sys.stdout.write(json.dumps({'message':'Update review config bundle','content':base64.b64encode(open(p,'rb').read()).decode('ascii'),'sha':s,'branch':'main'}))" "$tmpdir/${BUNDLE_PATH}" "$existing_sha" > "$tmpdir/update-bundle.json"
          commit_sha="$(gh api --method PUT "repos/${BUILDS_REPO}/contents/${BUNDLE_PATH}" --input "$tmpdir/update-bundle.json" --jq '.commit.sha')"
          bundle_sha256="$(cut -d' ' -f1 "$tmpdir/${BUNDLE_PATH}.sha256")"
          echo "Updated ${BUILDS_REPO}@${commit_sha}"
          echo "Bundle sha256: ${bundle_sha256}"
