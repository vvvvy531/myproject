name: Automated PR Review CTO

on:
  repository_dispatch:
    types:
      - private-review-cto
      - private-cto-task

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: cto-${{ github.event.client_payload.source_repo }}-${{ github.event.client_payload.pr_number || github.event.client_payload.ref }}
  cancel-in-progress: false

env:
  ARTIFACT_REPO: vvvvy531/myproject-linux-builds
  CTO_CREDENTIALS_REF: cto-credentials
  CTO_CREDENTIALS_PATH: cto-auth/credentials
  CTO_MODEL: ${{ vars.CTO_MODEL || 'gemini3_1_Pro_Preview' }}
  TASK_TYPE: ${{ github.event.client_payload.task_type || 'pr-review' }}
  TASK_GOAL: ${{ github.event.client_payload.task_goal || 'Review this pull request for correctness, security, performance, and maintainability issues.' }}
  SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
  PR_NUMBER: ${{ github.event.client_payload.pr_number }}
  REF: ${{ github.event.client_payload.ref || 'main' }}
  HEAD_SHA: ${{ github.event.client_payload.head_sha }}

jobs:
  run:
    name: Automated PR Review CTO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Validate payload
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOURCE_REPO}"
          test -n "${TASK_TYPE}"
          echo "task_type=${TASK_TYPE}"
          echo "source_repo=${SOURCE_REPO}"
          echo "pr_number=${PR_NUMBER:-none}"
          echo "ref=${REF}"
          echo "model=cto/${CTO_MODEL}"

      - name: Install CTO CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://cto.new/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cto" --version

      - name: Restore CTO credentials
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cto"
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/${CTO_CREDENTIALS_PATH}?ref=${CTO_CREDENTIALS_REF}" \
            > "$HOME/.cto/credentials"
          chmod 600 "$HOME/.cto/credentials"
          test -s "$HOME/.cto/credentials"
          echo "credentials_sha=$(sha256sum "$HOME/.cto/credentials" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Checkout working repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          ref: ${{ env.PR_NUMBER != '' && format('refs/pull/{0}/head', env.PR_NUMBER) || env.REF }}
          fetch-depth: 0
          lfs: false
          path: work
          persist-credentials: false

      - name: Prepare task context
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          : > /tmp/cto-task-context.md
          if [[ -n "${PR_NUMBER}" ]]; then
            echo "Target repository: ${SOURCE_REPO}" >> /tmp/cto-task-context.md
            echo "Target pull request: #${PR_NUMBER}" >> /tmp/cto-task-context.md
            gh pr view "$PR_NUMBER" --repo "$SOURCE_REPO" --json title,body,baseRefName,headRefName,url,files \
              > /tmp/pr-meta.json
            gh pr diff "$PR_NUMBER" --repo "$SOURCE_REPO" > /tmp/pr-diff.patch
            printf 'Title: %s\nBase: %s\nHead: %s\nURL: %s\n\nPR description:\n%s\n\nChanged files:\n' \
              "$(jq -r '.title // ""' /tmp/pr-meta.json)" \
              "$(jq -r '.baseRefName // ""' /tmp/pr-meta.json)" \
              "$(jq -r '.headRefName // ""' /tmp/pr-meta.json)" \
              "$(jq -r '.url // ""' /tmp/pr-meta.json)" \
              "$(jq -r '.body // ""' /tmp/pr-meta.json | head -c 4000)" \
              >> /tmp/cto-task-context.md
            jq -r '.files[].path // empty' /tmp/pr-meta.json >> /tmp/cto-task-context.md || true
          else
            printf 'Target repository: %s\nRef: %s\n' "$SOURCE_REPO" "$REF" >> /tmp/cto-task-context.md
          fi
          echo "Task goal:" >> /tmp/cto-task-context.md
          echo "$TASK_GOAL" >> /tmp/cto-task-context.md

      - name: Run CTO task
        id: cto
        working-directory: work
        shell: bash
        env:
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
        run: |
          set +e
          set +x
          extra_flags=()
          if [[ -s /tmp/pr-diff.patch ]]; then
            extra_flags+=(--file /tmp/pr-diff.patch)
          fi
          cto run \
            --model "cto/${CTO_MODEL}" \
            --format default \
            --dangerously-skip-permissions \
            "${extra_flags[@]}" \
            "$(cat /tmp/cto-task-context.md)" \
            > /tmp/cto-output.md 2> /tmp/cto-err.log
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "output_bytes=$(wc -c < /tmp/cto-output.md)" >> "$GITHUB_OUTPUT"
          if [[ -s /tmp/cto-err.log ]]; then
            echo "Redacted stderr tail:"
            sed -E 's/(cto_|refreshToken|accessToken)[A-Za-z0-9_.-]+/[redacted]/g' /tmp/cto-err.log | tail -160
          fi
          exit 0

      - name: Publish CTO result
        if: always() && env.PR_NUMBER != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          CTO_STATUS: ${{ steps.cto.outputs.status }}
          OUTPUT_BYTES: ${{ steps.cto.outputs.output_bytes }}
        run: |
          set +x
          summary="Task completed"
          if [[ "${CTO_STATUS:-1}" != "0" ]]; then
            summary="Task failed"
          fi
          if [[ "${OUTPUT_BYTES:-0}" -gt 0 ]]; then
            body="$(head -c 60000 /tmp/cto-output.md)"
          else
            body="CTO produced no output. Exit status: ${CTO_STATUS:-unknown}"
          fi
          cat > /tmp/comment.md <<EOF
          ## Automated PR Review CTO

          - **Task:** \`${TASK_TYPE}\`
          - **Target:** ${SOURCE_REPO}${PR_NUMBER:+#${PR_NUMBER}}
          - **Result:** ${summary}
          - **Workflow:** ${RUN_URL}

          ${body}
          EOF
          gh pr comment "$PR_NUMBER" --repo "$SOURCE_REPO" --body-file /tmp/comment.md

      - name: Update commit status
        if: always() && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          CTO_STATUS: ${{ steps.cto.outputs.status }}
        run: |
          set +x
          if [[ "${CTO_STATUS:-1}" == "0" ]]; then
            state=success; description="CTO task completed"
          else
            state=failure; description="CTO task failed"
          fi
          gh api "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state="$state" -f context="Automated PR Review CTO" \
            -f description="$description" -f target_url="$RUN_URL"

      - name: Refresh CTO credentials
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          set -euo pipefail
          if [[ ! -s "$HOME/.cto/credentials" ]]; then
            echo "No credentials file found, skip refresh"
            exit 0
          fi
          new_sha="$(sha256sum "$HOME/.cto/credentials" | awk '{print $1}')"
          echo "old_sha=${credentials_sha:-unknown}"
          echo "new_sha=${new_sha}"
          if [[ -n "${credentials_sha:-}" && "${credentials_sha}" == "${new_sha}" ]]; then
            echo "Credentials unchanged"
            exit 0
          fi
          remote_sha="$(gh api "repos/${ARTIFACT_REPO}/contents/${CTO_CREDENTIALS_PATH}?ref=${CTO_CREDENTIALS_REF}" --jq .sha)"
          content="$(base64 -w 0 "$HOME/.cto/credentials")"
          payload="$(jq -nc \
            --arg message "chore: refresh cto credentials from actions" \
            --arg branch "${CTO_CREDENTIALS_REF}" \
            --arg sha "$remote_sha" \
            --arg content "$content" \
            '{message:$message,branch:$branch,sha:$sha,content:$content}')"
          tmp="$(mktemp)"
          printf '%s' "$payload" > "$tmp"
          gh api --method PUT "repos/${ARTIFACT_REPO}/contents/${CTO_CREDENTIALS_PATH}" --input "$tmp" --jq '.commit.sha'
          rm -f "$tmp"
