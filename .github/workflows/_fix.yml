name: Fix sync script
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fix sync-credential.sh
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          ARTIFACT_REPO: vvvvy531/myproject-linux-builds
        run: |
          set -euo pipefail
          cd /tmp
          git clone --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/${ARTIFACT_REPO}.git" repo
          cd repo
          git config user.email "review-bot@users.noreply.github.com"
          git config user.name "Review Bot"
          
          # Fix ACCOUNT_MAX from 23 to 22
          sed -i 's/ACCOUNT_MAX:-23/ACCOUNT_MAX:-22/g' ci-scripts/sync-credential.sh
          sed -i "s/ACCOUNT_MAX', '23'/ACCOUNT_MAX', '22'/g" ci-scripts/sync-credential.sh
          
          echo "=== Verify ==="
          grep "ACCOUNT_MAX" ci-scripts/sync-credential.sh
          
          git add ci-scripts/sync-credential.sh
          git commit -m "fix: account range 2-22 (21 accounts)"
          git push origin main
          echo "FIX_DONE"
