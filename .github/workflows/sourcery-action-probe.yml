name: Sourcery Action Probe

on:
  workflow_dispatch:
    inputs:
      target_dir:
        description: Directory under private source to scan
        required: false
        default: Plugins/MapGenFeature

permissions:
  contents: read

env:
  SOURCE_REPO: vvvvy531/myproject-source

jobs:
  sourcery-probe:
    name: Sourcery private checkout probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private source main
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          ref: main
          fetch-depth: 0
          lfs: false
          submodules: false
          path: source
          persist-credentials: false

      - name: Validate target path
        shell: bash
        env:
          TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          set -euo pipefail
          if [[ -z "$TARGET_DIR" || "$TARGET_DIR" = /* || "$TARGET_DIR" == *..* ]]; then
            echo "Invalid target_dir" >&2
            exit 1
          fi
          if [[ ! -d "source/$TARGET_DIR" ]]; then
            echo "Missing target directory" >&2
            exit 1
          fi
          echo "target=source/$TARGET_DIR" >> "$GITHUB_ENV"

      - name: Run Sourcery action
        uses: sourcery-ai/action@v1
        with:
          token: ${{ secrets.SOURCERY_TOKEN }}
          target: ${{ env.target }}
          check: false
          in_place: false
          verbose: false

      - name: Write probe issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          set -euo pipefail
          title='Sourcery Action Probe'
          body_file=/tmp/sourcery-probe-issue.md
          cat > "$body_file" <<EOF
          # Sourcery Action Probe

          - Public run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Target dir: ${TARGET_DIR}
          - Result: inspect public run logs for Sourcery plan/quota/error output
          EOF
          issue="$(gh issue list -R "$SOURCE_REPO" --state all --search "$title in:title" --json number,title --jq '.[] | select(.title == "Sourcery Action Probe") | .number' | head -n 1)"
          if [[ -z "$issue" ]]; then
            gh issue create -R "$SOURCE_REPO" --title "$title" --body-file "$body_file" >/dev/null
          else
            gh issue edit "$issue" -R "$SOURCE_REPO" --body-file "$body_file"
            gh issue reopen "$issue" -R "$SOURCE_REPO" || true
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf source
          rm -f ~/.git-credentials
          git config --global --unset-all credential.helper || true
