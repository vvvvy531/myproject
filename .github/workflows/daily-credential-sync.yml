name: Daily Credential Sync

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-credential-sync
  cancel-in-progress: false

env:
  ARTIFACT_REPO: vvvvy531/myproject-linux-builds
  ARTIFACT_REF: linux-artifacts
  CRED_BASE: review-auth
  ACCOUNT_MIN: '2'
  ACCOUNT_MAX: '22'
  ROTATION_STATE_TITLE: Review Account Rotation State

jobs:
  sync:
    name: Login CLI and sync changed credentials
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install CodeRabbit CLI
        shell: bash
        run: |
          set -euo pipefail
          export CI=1
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone artifact repo and hash remote credentials
        id: remote
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          AUTH_PASSWORD: ${{ secrets.CODERABBIT_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$ARTIFACT_REF" \
            "https://x-access-token:${GH_TOKEN}@github.com/${ARTIFACT_REPO}.git" \
            /tmp/artifacts 2>/dev/null
          cd /tmp/artifacts
          git config user.email "review-bot@users.noreply.github.com"
          git config user.name "Review Bot"
          mkdir -p /tmp/hashes
          for n in $(seq "$ACCOUNT_MIN" "$ACCOUNT_MAX"); do
            enc="${CRED_BASE}/num.${n}.tar.gz.enc"
            plain="${CRED_BASE}/num.${n}.tar.gz"
            if [[ -f "$enc" ]]; then
              if openssl enc -d -aes-256-cbc -pbkdf2 \
                  -in "$enc" -out "/tmp/hashes/num.${n}.tar.gz" \
                  -pass pass:"$AUTH_PASSWORD" 2>/dev/null; then
                sha256sum "/tmp/hashes/num.${n}.tar.gz" | awk '{print $1}' > "/tmp/hashes/${n}.remote"
              else
                echo "::warning::num.${n}.tar.gz.enc decrypt failed; will re-upload"
              fi
            elif [[ -f "$plain" ]]; then
              sha256sum "$plain" | awk '{print $1}' > "/tmp/hashes/${n}.remote"
            else
              echo "::warning::no credential file for account ${n}; will upload fresh"
            fi
          done

      - name: Load rotation state and build account queue
        id: queue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state_file=/tmp/rotation-state.md
          issue="$(TITLE="$ROTATION_STATE_TITLE" gh issue list -R "$GITHUB_REPOSITORY" --state all --search "$ROTATION_STATE_TITLE in:title" --json number,title --jq '[.[] | select(.title == env.TITLE) | .number][0] // ""')"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          if [[ -n "$issue" ]]; then
            gh issue view "$issue" -R "$GITHUB_REPOSITORY" --json body --jq .body > "$state_file" || true
          else
            : > "$state_file"
          fi
          python3 - "$state_file" "$ACCOUNT_MIN" "$ACCOUNT_MAX" <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re, sys
          body = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          mn, mx = int(sys.argv[2]), int(sys.argv[3])
          m = re.search(r'```json\s*(\{.*?\})\s*```', body, re.S)
          state = json.loads(m.group(1)) if m else {}
          n = int(state.get('next_account', mn) or mn)
          if n < mn or n > mx:
              n = mn
          queue = [str(x) for x in list(range(n, mx + 1)) + list(range(mn, n))]
          print('queue=' + ','.join(queue))
          PY

      - name: Login each account and push on credential change
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          AUTH_PASSWORD: ${{ secrets.CODERABBIT_AUTH_PASSWORD }}
          QUEUE: ${{ steps.queue.outputs.queue }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          IFS=',' read -ra accounts <<< "$QUEUE"
          updated=""
          for n in "${accounts[@]}"; do
            echo "::group::Account ${n}"
            rm -rf "$HOME/.coderabbit"
            src="/tmp/hashes/num.${n}.tar.gz"
            if [[ -f "$src" ]]; then
              tar --no-same-owner --no-same-permissions -xzf "$src" -C "$HOME"
              # Fallback for archives stored under .review-cli (old sync bug)
              if [[ ! -d "$HOME/.coderabbit" && -d "$HOME/.review-cli" ]]; then
                mv "$HOME/.review-cli" "$HOME/.coderabbit"
              fi
              chmod 700 "$HOME/.coderabbit" 2>/dev/null || true
            else
              echo "No stored credential; attempting login from scratch"
            fi

            status=0
            coderabbit auth status >/dev/null 2>&1 || status=$?
            if [[ "$status" != "0" && -f "$src" ]]; then
              echo "auth status failed with stored credential; attempting fresh login"
              rm -rf "$HOME/.coderabbit"
              coderabbit auth login || true
            elif [[ "$status" != "0" ]]; then
              coderabbit auth login || true
            fi

            if ! coderabbit auth status >/dev/null 2>&1; then
              echo "::warning::account ${n}: login failed, skipping"
              echo "::endgroup::"
              continue
            fi

            user="$(python3 -c "
          import json
          try:
              d = json.load(open('$HOME/.coderabbit/auth.json'))
              print(d.get('user', {}).get('user_name', '?'))
          except Exception:
              print('?')
          ")"
            echo "account ${n}: logged in as ${user}"

            tar -chzf "/tmp/num.${n}.after.tar.gz" -C "$HOME" ".coderabbit"
            local_hash="$(sha256sum "/tmp/num.${n}.after.tar.gz" | awk '{print $1}')"
            remote_hash=""
            [[ -f "/tmp/hashes/${n}.remote" ]] && remote_hash="$(cat "/tmp/hashes/${n}.remote")"
            if [[ "$local_hash" == "$remote_hash" ]]; then
              echo "credential unchanged; skip push"
            else
              echo "credential changed (remote=${remote_hash:-none} local=$local_hash); pushing"
              openssl enc -e -aes-256-cbc -pbkdf2 \
                -in "/tmp/num.${n}.after.tar.gz" \
                -out "/tmp/artifacts/${CRED_BASE}/num.${n}.tar.gz.enc" \
                -pass pass:"$AUTH_PASSWORD"
              updated="${updated} ${n}"
            fi
            rm -f "/tmp/num.${n}.after.tar.gz"
            echo "::endgroup::"
          done

          if [[ -n "${updated// /}" ]]; then
            cd /tmp/artifacts
            git add "${CRED_BASE}"
            if git diff --cached --quiet; then
              echo "No net changes after all accounts"
            else
              git commit -m "chore: daily credential refresh (accounts:${updated})"
              git pull --rebase origin "$ARTIFACT_REF"
              git push origin "$ARTIFACT_REF"
              echo "pushed:${updated}"
            fi
          else
            echo "All credentials up to date; nothing pushed"
          fi
