name: Automated PR Review C

on:
  repository_dispatch:
    types: [private-review-c]
  workflow_dispatch:
    inputs:
      source_repo:
        description: Source repo
        required: true
        default: vvvvy531/myproject-source
      pr_number:
        description: PR number
        required: true
      head_sha:
        description: Optional head SHA
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

env:
  SCRIPTS_REF: main
  ARTIFACT_REPO: vvvvy531/myproject-linux-builds

concurrency:
  group: review-c-${{ github.event.client_payload.source_repo || inputs.source_repo }}-${{ github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_REPO: ${{ github.event.client_payload.source_repo || inputs.source_repo }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number || inputs.pr_number }}
      HEAD_SHA: ${{ github.event.client_payload.head_sha || inputs.head_sha }}
    steps:
      - name: Validate PR payload
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_REPO" in ""|*" "*|*".."*|*"//"*) echo "Invalid" >&2; exit 1 ;; esac
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "Invalid" >&2; exit 1 ;; esac
          echo "Review target: ${SOURCE_REPO}#${PR_NUMBER}"

      - name: Mark review pending
        if: env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          gh api --method POST "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state=pending -f context='Public AI PR Review' \
            -f description='Claude review in progress' -f target_url="$RUN_URL"

      - name: Checkout private source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0
          lfs: false
          submodules: recursive
          path: source
          persist-credentials: false

      - name: Execute Claude review
        id: review
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          GITHUB_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          ARTIFACT_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          ARTIFACT_REPO: ${{ env.ARTIFACT_REPO }}
          SOURCE_REPO: ${{ env.SOURCE_REPO }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCRIPTS_REF: ${{ env.SCRIPTS_REF }}
        run: |
          set +x
          set +e
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/ci-scripts/run-claude-review.sh?ref=${SCRIPTS_REF}" \
            > /tmp/_run_claude_review.sh
          bash /tmp/_run_claude_review.sh
          status=$?
          rm -f /tmp/_run_claude_review.sh
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Mark review result
        if: always() && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +x
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success; description='Claude review completed'
          else
            state=failure; description='Claude review failed'
          fi
          gh api --method POST "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state="$state" -f context='Public AI PR Review' \
            -f description="$description" -f target_url="$RUN_URL"

      - name: Cleanup
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/ci-scripts/cleanup-review.sh?ref=${SCRIPTS_REF}" \
            > /tmp/_cleanup.sh
          bash /tmp/_cleanup.sh
          rm -f /tmp/_cleanup.sh
