name: Automated PR Review C

on:
  repository_dispatch:
    types: [private-review-c]

permissions:
  contents: read

concurrency:
  group: review-c-${{ github.event.client_payload.source_repo }}-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: true

env:
  SCRIPTS_REF: main
  ARTIFACT_REPO: vvvvy531/myproject-linux-builds

jobs:
  review:
    name: Automated PR Review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_REPO: ${{ github.event.client_payload.source_repo }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      HEAD_SHA: ${{ github.event.client_payload.head_sha }}
    steps:
      - name: Validate PR payload
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_REPO" in
            vvvvy531/myproject-source) ;;
            *) echo "Invalid source_repo payload" >&2; exit 1 ;;
          esac
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "Invalid pr_number payload" >&2; exit 1 ;;
          esac
          echo "Review target: ${SOURCE_REPO}#${PR_NUMBER}"

      - name: Mark review pending
        if: env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          gh api "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state=pending -f context="Public AI PR Review" \
            -f description="AI review in progress" -f target_url="$RUN_URL"

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          ref: refs/pull/${{ env.PR_NUMBER }}/head
          fetch-depth: 0
          lfs: false
          submodules: recursive
          path: source
          persist-credentials: false

      - name: Execute AI review
        id: review
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          GITHUB_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          AI_KEY: ${{ secrets.REVIEW_PROXY_KEY }}
          AI_URL: https://api.logincore.me/v1
          AI_MODEL: review
          ARTIFACT_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          ARTIFACT_REPO: ${{ env.ARTIFACT_REPO }}
          SOURCE_REPO: ${{ env.SOURCE_REPO }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          SCRIPTS_REF: ${{ env.SCRIPTS_REF }}
          REVIEW_FOCUS: |
            Review this pull request with focus on the specific programming languages and tools used in the changes.
            Analyze code based on language-specific best practices (Rust, C++, C#, GDScript, or others as applicable).
            Focus only on high-confidence correctness bugs, build safety, language-specific issues, CI/CD, release artifacts, shell commands, secrets leakage, permissions, and supply-chain risks.
            Do not assume any specific game engine or framework unless explicitly present in the code.
            Do not suggest broad refactors or style-only changes.
        run: |
          set +x
          set +e
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/ci-scripts/run-claude-review.sh?ref=${SCRIPTS_REF}" \
            > /tmp/_run_claude_review.sh
          bash /tmp/_run_claude_review.sh
          status=$?
          rm -f /tmp/_run_claude_review.sh
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Mark review result
        if: always() && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +x
          if [[ "$JOB_STATUS" == "success" ]]; then
            state=success; description="AI review completed"
          else
            state=failure; description="AI review failed"
          fi
          gh api "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state="$state" -f context="Public AI PR Review" \
            -f description="$description" -f target_url="$RUN_URL"

      - name: Cleanup
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/ci-scripts/cleanup-review.sh?ref=${SCRIPTS_REF}" \
            > /tmp/_cleanup.sh
          bash /tmp/_cleanup.sh
          rm -f /tmp/_cleanup.sh
