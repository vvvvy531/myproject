name: CodeRabbit Main Full Review

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPO: vvvvy531/myproject-source
  ARTIFACT_REPO: vvvvy531/myproject-linux-builds
  AUTH_TAG: coderabbit-auth
  STATE_TAG: coderabbit-state
  REPORT_DIR: coderabbit-full-report

jobs:
  coderabbit-full:
    name: CodeRabbit full main history review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private source main
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          ref: main
          fetch-depth: 0
          lfs: false
          submodules: recursive
          path: source
          persist-credentials: false

      - name: Install CodeRabbit CLI
        shell: bash
        run: |
          set -euo pipefail
          export CI=1
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore CodeRabbit auth
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          CODERABBIT_AUTH_PASSWORD: ${{ secrets.CODERABBIT_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          gh release download "$AUTH_TAG" -R "$ARTIFACT_REPO" -p coderabbit-auth.tar.gz.enc -D /tmp --clobber
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/coderabbit-auth.tar.gz.enc \
            -out /tmp/coderabbit-auth.tar.gz \
            -pass pass:"$CODERABBIT_AUTH_PASSWORD"
          tar -xzf /tmp/coderabbit-auth.tar.gz -C "$HOME"
          rm -f /tmp/coderabbit-auth.tar.gz /tmp/coderabbit-auth.tar.gz.enc
          chmod 700 "$HOME/.coderabbit" || true

      - name: Determine full history range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          base_sha="$(git -C source rev-list --max-parents=0 HEAD | tail -n 1)"
          head_sha="$(git -C source rev-parse HEAD)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$base_sha" > "$REPORT_DIR/base-sha.txt"
          printf '%s\n' "$head_sha" > "$REPORT_DIR/head-sha.txt"
          printf '%s\n' "full-root-to-head" > "$REPORT_DIR/mode.txt"

      - name: Run CodeRabbit CLI full review
        shell: bash
        working-directory: source
        run: |
          set +x
          coderabbit review --agent --base-commit "${{ steps.range.outputs.base_sha }}" > "../$REPORT_DIR/coderabbit-review.jsonl"

      - name: Summarize findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, collections
          report=pathlib.Path('coderabbit-full-report')
          findings=[]
          src=report/'coderabbit-review.jsonl'
          if src.exists():
              for line in src.read_text(encoding='utf-8', errors='replace').splitlines():
                  try: obj=json.loads(line)
                  except Exception: continue
                  if obj.get('type') == 'finding': findings.append(obj)
          counts=collections.Counter(f.get('severity','unknown') for f in findings)
          lines=['# CodeRabbit Full Main History Review','',f'- Base/root: {(report/"base-sha.txt").read_text().strip()}',f'- Head: {(report/"head-sha.txt").read_text().strip()}',f'- Findings: {len(findings)}',f'- Critical: {counts.get("critical",0)}',f'- Major: {counts.get("major",0)}',f'- Minor: {counts.get("minor",0)}','','## Top findings','']
          for f in findings[:50]:
              lines.append(f'- **{f.get("severity","unknown")}** `{f.get("fileName","")}`: {str(f.get("message") or f.get("title") or f.get("codegenInstructions") or "").replace(chr(10)," ")[:300]}')
          (report/'coderabbit-summary.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY

      - name: Publish full report and issue
        if: always()
        shell: bash
        env:
          LINUX_BUILDS_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          PRIVATE_SOURCE_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          report_tag="coderabbit-full-${GITHUB_RUN_NUMBER}"
          GH_TOKEN="$LINUX_BUILDS_TOKEN" gh release create "$report_tag" -R "$ARTIFACT_REPO" --title "$report_tag" --notes-file "$REPORT_DIR/coderabbit-summary.md" --latest=false || true
          GH_TOKEN="$LINUX_BUILDS_TOKEN" gh release upload "$report_tag" -R "$ARTIFACT_REPO" "$REPORT_DIR"/* --clobber
          body_file="$REPORT_DIR/issue-body.md"
          cat > "$body_file" <<EOF
          # CodeRabbit Full Main History Review

          - Public run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Release assets: https://github.com/${ARTIFACT_REPO}/releases/tag/${report_tag}

          $(cat "$REPORT_DIR/coderabbit-summary.md")
          EOF
          title='CodeRabbit Full Main History Review'
          issue="$(GH_TOKEN="$PRIVATE_SOURCE_TOKEN" gh issue list -R "$SOURCE_REPO" --state all --search "$title in:title" --json number,title --jq '.[] | select(.title == "CodeRabbit Full Main History Review") | .number' | head -n 1)"
          if [[ -z "$issue" ]]; then GH_TOKEN="$PRIVATE_SOURCE_TOKEN" gh issue create -R "$SOURCE_REPO" --title "$title" --body-file "$body_file" >/dev/null; else GH_TOKEN="$PRIVATE_SOURCE_TOKEN" gh issue edit "$issue" -R "$SOURCE_REPO" --body-file "$body_file"; GH_TOKEN="$PRIVATE_SOURCE_TOKEN" gh issue reopen "$issue" -R "$SOURCE_REPO" || true; fi

      - name: Seed incremental completed state
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          set -euo pipefail
          printf '{"last_completed_sha":"%s","base_sha":"%s","mode":"full-root-to-head","run_id":"%s","updated_at":"%s"}\n' "${{ steps.range.outputs.head_sha }}" "${{ steps.range.outputs.base_sha }}" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > coderabbit-state.json
          gh release create "$STATE_TAG" -R "$ARTIFACT_REPO" --title "$STATE_TAG" --notes 'CodeRabbit CLI last completed state' --latest=false || true
          gh release upload "$STATE_TAG" -R "$ARTIFACT_REPO" coderabbit-state.json --clobber

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf source "$HOME/.coderabbit"
          rm -f ~/.git-credentials
          git config --global --unset-all credential.helper || true
