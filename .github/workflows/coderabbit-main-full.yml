name: CodeRabbit Main Full Review

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      reset:
        description: Reset full scan directory progress
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

env:
  SOURCE_REPO: vvvvy531/myproject-source
  ARTIFACT_REPO: vvvvy531/myproject-linux-builds
  AUTH_TAG: coderabbit-auth
  REPORT_DIR: coderabbit-full-report
  MAX_CHUNKS_PER_RUN: "3"

jobs:
  coderabbit-full:
    name: CodeRabbit full main history review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private source main
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          ref: main
          fetch-depth: 0
          lfs: false
          submodules: recursive
          path: source
          persist-credentials: false

      - name: Install CodeRabbit CLI
        shell: bash
        run: |
          set -euo pipefail
          export CI=1
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore CodeRabbit auth
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          CODERABBIT_AUTH_PASSWORD: ${{ secrets.CODERABBIT_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          gh release download "$AUTH_TAG" -R "$ARTIFACT_REPO" -p coderabbit-auth.tar.gz.enc -D /tmp --clobber
          openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/coderabbit-auth.tar.gz.enc -out /tmp/coderabbit-auth.tar.gz -pass pass:"$CODERABBIT_AUTH_PASSWORD"
          tar -xzf /tmp/coderabbit-auth.tar.gz -C "$HOME"
          rm -f /tmp/coderabbit-auth.tar.gz /tmp/coderabbit-auth.tar.gz.enc
          chmod 700 "$HOME/.coderabbit" || true

      - name: Determine full history range and chunk window
        id: range
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RESET_SCAN: ${{ inputs.reset || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          base_sha="$(git -C source rev-list --max-parents=0 HEAD | tail -n 1)"
          head_sha="$(git -C source rev-parse HEAD)"
          dirs=(
            "Plugins/AIFeature"
            "Plugins/MapGenFeature"
            "Plugins/SaveSystemFeature"
            "Plugins/RoguelikeCoreFeature"
            "Plugins/RoguelikeSharedTypesFeature"
            "Plugins/GameContentFeature"
            "Plugins/GameplayMessageFeature"
            "Plugins/InputSystemFeature"
            "Plugins/MetaProgressionFeature"
            "Plugins/QuestDialogueFeature"
            "Plugins/TimeManagementFeature"
            "Plugins/UIFeature"
            "Plugins/YarnSpinner"
          )
          printf '%s\n' "${dirs[@]}" > "$REPORT_DIR/all-chunks.txt"
          next_index=0
          state_title='CodeRabbit Full Scan State'
          issue="$(gh issue list -R "$SOURCE_REPO" --state all --search "$state_title in:title" --json number,title --jq '.[] | select(.title == "CodeRabbit Full Scan State") | .number' | head -n 1)"
          if [[ "$RESET_SCAN" != "true" && -n "$issue" ]]; then
            gh issue view "$issue" -R "$SOURCE_REPO" --json body --jq .body > /tmp/coderabbit-full-scan-state.md || true
            next_index="$(python3 - <<'PY'
          import json,re,pathlib
          s=pathlib.Path('/tmp/coderabbit-full-scan-state.md').read_text(errors='ignore') if pathlib.Path('/tmp/coderabbit-full-scan-state.md').exists() else ''
          m=re.search(r'```json\s*(\{.*?\})\s*```', s, re.S)
          print(json.loads(m.group(1)).get('next_chunk_index',0) if m else 0)
          PY
          )"
          fi
          total="${#dirs[@]}"
          if (( next_index >= total )); then next_index=0; fi
          end_index=$((next_index + MAX_CHUNKS_PER_RUN))
          if (( end_index > total )); then end_index=$total; fi
          : > "$REPORT_DIR/selected-chunks.txt"
          for ((i=next_index; i<end_index; i++)); do printf '%s\n' "${dirs[$i]}" >> "$REPORT_DIR/selected-chunks.txt"; done
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "start_index=$next_index" >> "$GITHUB_OUTPUT"
          echo "end_index=$end_index" >> "$GITHUB_OUTPUT"
          echo "total_chunks=$total" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$base_sha" > "$REPORT_DIR/base-sha.txt"
          printf '%s\n' "$head_sha" > "$REPORT_DIR/head-sha.txt"
          printf '%s\n' full-root-to-head-window > "$REPORT_DIR/mode.txt"

      - name: Run CodeRabbit CLI full review chunk window
        id: review
        shell: bash
        working-directory: source
        run: |
          set +x
          mkdir -p "../$REPORT_DIR/chunks"
          : > "../$REPORT_DIR/chunk-status.tsv"
          failed=0
          while IFS= read -r dir; do
            [[ -n "$dir" && -e "$dir" ]] || continue
            safe="$(printf '%s' "$dir" | tr '/.' '__')"
            echo "Review chunk: $dir"
            if coderabbit review --agent --base-commit "${{ steps.range.outputs.base_sha }}" --dir "$dir" > "../$REPORT_DIR/chunks/${safe}.jsonl"; then
              printf '%s\tsuccess\n' "$dir" >> "../$REPORT_DIR/chunk-status.tsv"
            else
              code=$?
              printf '%s\tfailure:%s\n' "$dir" "$code" >> "../$REPORT_DIR/chunk-status.tsv"
              failed=1
              break
            fi
          done < "../$REPORT_DIR/selected-chunks.txt"
          cat ../$REPORT_DIR/chunks/*.jsonl > "../$REPORT_DIR/coderabbit-review.jsonl" 2>/dev/null || : > "../$REPORT_DIR/coderabbit-review.jsonl"
          exit "$failed"

      - name: Summarize findings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,collections
          report=pathlib.Path('coderabbit-full-report'); findings=[]; src=report/'coderabbit-review.jsonl'
          if src.exists():
            for line in src.read_text(encoding='utf-8',errors='replace').splitlines():
              try: obj=json.loads(line)
              except Exception: continue
              if obj.get('type')=='finding': findings.append(obj)
          c=collections.Counter(f.get('severity','unknown') for f in findings)
          status=(report/'chunk-status.tsv').read_text(encoding='utf-8', errors='replace') if (report/'chunk-status.tsv').exists() else ''
          selected=(report/'selected-chunks.txt').read_text(encoding='utf-8', errors='replace') if (report/'selected-chunks.txt').exists() else ''
          lines=['# CodeRabbit Full Main History Review','',f'- Base/root: {(report/"base-sha.txt").read_text().strip()}',f'- Head: {(report/"head-sha.txt").read_text().strip()}',f'- Chunk window: {selected.strip().replace(chr(10), ", ")}',f'- Findings this run: {len(findings)}',f'- Critical: {c.get("critical",0)}',f'- Major: {c.get("major",0)}',f'- Minor: {c.get("minor",0)}','','## Chunk status','']
          for row in status.splitlines():
            if '\t' in row:
              d,s=row.split('\t',1); lines.append(f'- `{d}`: {s}')
          lines += ['', '## Top findings', '']
          seen=set()
          for f in findings:
            key=(f.get('severity'),f.get('fileName'),str(f.get('message') or f.get('title') or f.get('codegenInstructions') or '')[:120])
            if key in seen: continue
            seen.add(key)
            lines.append(f'- **{f.get("severity","unknown")}** `{f.get("fileName","")}`: {str(f.get("message") or f.get("title") or f.get("codegenInstructions") or "").replace(chr(10)," ")[:300]}')
            if len(seen) >= 80: break
          (report/'coderabbit-summary.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Upsert full report issue in source repo
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          title='CodeRabbit Full Main History Review'
          body_file="$REPORT_DIR/issue-body.md"
          cat > "$body_file" <<EOF
          # CodeRabbit Full Main History Review

          - Public run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source repo: ${SOURCE_REPO}
          - Progress: chunks ${{ steps.range.outputs.start_index }}..${{ steps.range.outputs.end_index }} / ${{ steps.range.outputs.total_chunks }}

          $(cat "$REPORT_DIR/coderabbit-summary.md")
          EOF
          issue="$(gh issue list -R "$SOURCE_REPO" --state all --search "$title in:title" --json number,title --jq '.[] | select(.title == "CodeRabbit Full Main History Review") | .number' | head -n 1)"
          if [[ -z "$issue" ]]; then gh issue create -R "$SOURCE_REPO" --title "$title" --body-file "$body_file" >/dev/null; else gh issue edit "$issue" -R "$SOURCE_REPO" --body-file "$body_file"; gh issue reopen "$issue" -R "$SOURCE_REPO" || true; fi

      - name: Update full scan state issue
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          next='${{ steps.range.outputs.end_index }}'
          total='${{ steps.range.outputs.total_chunks }}'
          completed=false
          if (( next >= total )); then completed=true; fi
          title='CodeRabbit Full Scan State'
          body_file="$REPORT_DIR/full-scan-state-body.md"
          cat > "$body_file" <<EOF
          # CodeRabbit Full Scan State

          Do not edit unless resetting CodeRabbit full scan progress.

          ```json
          {"next_chunk_index":${next},"total_chunks":${total},"completed":${completed},"head_sha":"${{ steps.range.outputs.head_sha }}","base_sha":"${{ steps.range.outputs.base_sha }}","run_id":"${GITHUB_RUN_ID}","updated_at":"$(date -u +%FT%TZ)"}
          ```
          EOF
          issue="$(gh issue list -R "$SOURCE_REPO" --state all --search "$title in:title" --json number,title --jq '.[] | select(.title == "CodeRabbit Full Scan State") | .number' | head -n 1)"
          if [[ -z "$issue" ]]; then gh issue create -R "$SOURCE_REPO" --title "$title" --body-file "$body_file" >/dev/null; else gh issue edit "$issue" -R "$SOURCE_REPO" --body-file "$body_file"; gh issue reopen "$issue" -R "$SOURCE_REPO" || true; fi

      - name: Seed incremental state when full scan completes
        if: success() && steps.range.outputs.end_index == steps.range.outputs.total_chunks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          title='CodeRabbit CLI State'
          body_file="$REPORT_DIR/state-issue-body.md"
          cat > "$body_file" <<EOF
          # CodeRabbit CLI State

          Do not edit unless resetting CodeRabbit incremental range.

          ```json
          {"last_completed_sha":"${{ steps.range.outputs.head_sha }}","base_sha":"${{ steps.range.outputs.base_sha }}","mode":"full-root-to-head-completed","run_id":"${GITHUB_RUN_ID}","updated_at":"$(date -u +%FT%TZ)"}
          ```
          EOF
          issue="$(gh issue list -R "$SOURCE_REPO" --state all --search "$title in:title" --json number,title --jq '.[] | select(.title == "CodeRabbit CLI State") | .number' | head -n 1)"
          if [[ -z "$issue" ]]; then gh issue create -R "$SOURCE_REPO" --title "$title" --body-file "$body_file" >/dev/null; else gh issue edit "$issue" -R "$SOURCE_REPO" --body-file "$body_file"; gh issue reopen "$issue" -R "$SOURCE_REPO" || true; fi

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf source "$HOME/.coderabbit" "$REPORT_DIR"
          rm -f ~/.git-credentials
          git config --global --unset-all credential.helper || true
