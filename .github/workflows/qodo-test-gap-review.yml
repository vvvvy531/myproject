name: Qodo Test Gap Review

on:
  workflow_dispatch:
    inputs:
      target_dir:
        description: Directory under private source to review
        required: false
        default: Plugins/MapGenFeature

permissions:
  contents: read

env:
  SOURCE_REPO: vvvvy531/myproject-source
  REPORT_DIR: qodo-test-gap-report

jobs:
  qodo-test-gap:
    name: Qodo test gap review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Qodo CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @qodo/command

      - name: Checkout private source main
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          ref: main
          fetch-depth: 1
          lfs: false
          submodules: false
          path: source
          persist-credentials: false

      - name: Run Qodo test gap review
        id: qodo
        shell: bash
        env:
          QODO_API_KEY: ${{ secrets.QODO_API_KEY }}
          TARGET_DIR: ${{ inputs.target_dir }}
        run: |
          set +x
          mkdir -p "$REPORT_DIR"
          if [[ -z "$TARGET_DIR" || "$TARGET_DIR" == /* || "$TARGET_DIR" == *..* ]]; then
            echo "Invalid target_dir" >&2
            exit 1
          fi
          if [[ ! -d "source/$TARGET_DIR" ]]; then
            echo "Missing target directory: $TARGET_DIR" >&2
            exit 1
          fi
          prompt="Analyze this Unreal Engine project directory for test gaps. Focus on missing unit/automation tests, high-risk edge cases, regression scenarios, mocks/fixtures needed, and concrete test names. Do not modify files. Do not output large code blocks. Return a concise markdown report with prioritized test recommendations."
          timeout 900s qodo "$prompt" --ci -y --permissions=r --dir "source/$TARGET_DIR" > "$REPORT_DIR/qodo-test-gap.md" 2> "$REPORT_DIR/qodo-stderr.txt"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$TARGET_DIR" > "$REPORT_DIR/target-dir.txt"
          exit 0

      - name: Write Qodo report issue to source repo
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          title='Qodo Test Gap Review'
          body_file="$REPORT_DIR/issue-body.md"
          target_dir="$(cat "$REPORT_DIR/target-dir.txt" 2>/dev/null || echo '${{ inputs.target_dir }}')"
          cat > "$body_file" <<EOF
          # Qodo Test Gap Review

          - Public run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Target dir: ${target_dir}
          - Exit code: ${{ steps.qodo.outputs.exit_code }}

          ## Qodo output

          $(cat "$REPORT_DIR/qodo-test-gap.md" 2>/dev/null || true)

          ## stderr

          ```text
          $(tail -200 "$REPORT_DIR/qodo-stderr.txt" 2>/dev/null || true)
          ```
          EOF
          issue="$(gh issue list -R "$SOURCE_REPO" --state all --search "$title in:title" --json number,title --jq '.[] | select(.title == "Qodo Test Gap Review") | .number' | head -n 1)"
          if [[ -z "$issue" ]]; then
            gh issue create -R "$SOURCE_REPO" --title "$title" --body-file "$body_file" >/dev/null
          else
            gh issue edit "$issue" -R "$SOURCE_REPO" --body-file "$body_file"
            gh issue reopen "$issue" -R "$SOURCE_REPO" || true
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf source "$REPORT_DIR"
          rm -f ~/.git-credentials
          git config --global --unset-all credential.helper || true
