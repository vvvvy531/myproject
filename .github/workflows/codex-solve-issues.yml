name: Codex Issue Solver

on:
  repository_dispatch:
    types: [codex-solve-issues]
  workflow_dispatch:
    inputs:
      max_issues:
        description: "Maximum issues to process per run"
        required: false
        default: "5"
      source_repo:
        description: "Source repository"
        required: false
        default: "vvvvy531/myproject-source"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: codex-solve-${{ github.event.client_payload.source_repo || 'manual' }}
  cancel-in-progress: false

env:
  SCRIPTS_REF: main
  ARTIFACT_REPO: vvvvy531/myproject-linux-builds

jobs:
  solve:
    name: Solve Issues with Codex
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_REPO: ${{ github.event.client_payload.source_repo || github.event.inputs.source_repo || 'vvvvy531/myproject-source' }}
      MAX_ISSUES: ${{ github.event.client_payload.max_issues || github.event.inputs.max_issues || '5' }}
    steps:
      - name: Validate trigger
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_REPO" in
            vvvvy531/myproject-source) ;;
            *) echo "Invalid source_repo: $SOURCE_REPO" >&2; exit 1 ;;
          esac
          echo "Solving issues for: $SOURCE_REPO (max $MAX_ISSUES)"

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          fetch-depth: 0
          lfs: false
          submodules: recursive
          path: source
          persist-credentials: false

      - name: Execute Codex Issue Solver
        id: solve
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          GITHUB_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          AI_KEY: ${{ secrets.REVIEW_PROXY_KEY }}
          AI_URL: ${{ secrets.REVIEW_PROXY_URL }}
          AI_MODEL: ${{ secrets.REVIEW_MODEL || 'o4-mini' }}
          ARTIFACT_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          ARTIFACT_REPO: ${{ env.ARTIFACT_REPO }}
          SOURCE_REPO: ${{ env.SOURCE_REPO }}
          MAX_ISSUES: ${{ env.MAX_ISSUES }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCRIPTS_REF: ${{ env.SCRIPTS_REF }}
        run: |
          set +x
          set +e
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/ci-scripts/run-codex-solve.sh?ref=${SCRIPTS_REF}" \
            > /tmp/_run_codex_solve.sh
          bash /tmp/_run_codex_solve.sh
          status=$?
          rm -f /tmp/_run_codex_solve.sh
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload solve summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-solve-report-${{ github.run_number }}
          path: source/codex-solve-summary.md
          if-no-files-found: ignore

      - name: Post summary comment
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          SOURCE_REPO: ${{ env.SOURCE_REPO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          if [[ -f source/codex-solve-summary.md ]]; then
            {
              echo "## 🤖 Codex Issue Solver Report"
              echo ""
              echo "**Run**: [View Details](${RUN_URL})"
              echo ""
              cat source/codex-solve-summary.md
            } > /tmp/codex-solve-comment.md
            # Find or create a tracking issue for solver runs
            TRACKING=$(gh issue list --repo "$SOURCE_REPO" --state open --search "Codex Solver Run" --json number --jq '.[0].number')
            if [[ -n "$TRACKING" ]]; then
              gh issue comment "$TRACKING" --repo "$SOURCE_REPO" --body-file /tmp/codex-solve-comment.md || true
            fi
          fi

      - name: Cleanup
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/ci-scripts/cleanup-review.sh?ref=${SCRIPTS_REF}" \
            > /tmp/_cleanup.sh
          bash /tmp/_cleanup.sh
          rm -f /tmp/_cleanup.sh