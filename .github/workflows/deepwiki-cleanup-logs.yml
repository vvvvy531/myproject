name: Cleanup DeepWiki Logs

on:
  workflow_run:
    workflows: ["DeepWiki Private Wiki"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  delete-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed DeepWiki run logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set +x
          gh api --method DELETE "repos/${REPO}/actions/runs/${RUN_ID}/logs" >/dev/null 2>&1 || true