name: CodeRabbit Single Directory Diagnostic

on:
  workflow_dispatch:
    inputs:
      dir:
        description: Directory to review
        required: true
        default: Plugins/MapGenFeature
        type: string

permissions:
  contents: read

env:
  SOURCE_REPO: vvvvy531/myproject-source
  ARTIFACT_REPO: vvvvy531/myproject-linux-builds
  AUTH_TAG: coderabbit-auth
  REPORT_DIR: coderabbit-single-dir-report

jobs:
  diagnose:
    name: CodeRabbit single directory diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private source main
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          ref: main
          fetch-depth: 0
          lfs: false
          submodules: recursive
          path: source
          persist-credentials: false

      - name: Install CodeRabbit CLI
        shell: bash
        run: |
          set -euo pipefail
          export CI=1
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Restore CodeRabbit auth
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          CODERABBIT_AUTH_PASSWORD: ${{ secrets.CODERABBIT_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          gh release download "$AUTH_TAG" -R "$ARTIFACT_REPO" -p coderabbit-auth.tar.gz.enc -D /tmp --clobber
          openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/coderabbit-auth.tar.gz.enc -out /tmp/coderabbit-auth.tar.gz -pass pass:"$CODERABBIT_AUTH_PASSWORD"
          tar -xzf /tmp/coderabbit-auth.tar.gz -C "$HOME"
          rm -f /tmp/coderabbit-auth.tar.gz /tmp/coderabbit-auth.tar.gz.enc
          chmod 700 "$HOME/.coderabbit" || true

      - name: Run single directory review
        id: review
        shell: bash
        working-directory: source
        env:
          TARGET_DIR: ${{ inputs.dir }}
        run: |
          set +x
          mkdir -p "../$REPORT_DIR"
          base_sha="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          head_sha="$(git rev-parse HEAD)"
          printf '%s\n' "$base_sha" > "../$REPORT_DIR/base-sha.txt"
          printf '%s\n' "$head_sha" > "../$REPORT_DIR/head-sha.txt"
          printf '%s\n' "$TARGET_DIR" > "../$REPORT_DIR/target-dir.txt"
          coderabbit --version > "../$REPORT_DIR/coderabbit-version.txt" 2>&1 || true
          if [[ ! -e "$TARGET_DIR" ]]; then
            echo "Target directory does not exist: $TARGET_DIR" > "../$REPORT_DIR/stderr.txt"
            echo "exit_code=99" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          coderabbit review --agent --base-commit "$base_sha" --dir "$TARGET_DIR" > "../$REPORT_DIR/stdout.jsonl" 2> "../$REPORT_DIR/stderr.txt"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import pathlib
          report=pathlib.Path('../coderabbit-single-dir-report')
          for name in ['stdout.jsonl','stderr.txt']:
            p=report/name
            text=p.read_text(encoding='utf-8', errors='replace') if p.exists() else ''
            (report/f'{name}.tail').write_text(text[-12000:], encoding='utf-8')
          PY

      - name: Upsert diagnostic issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        run: |
          set -euo pipefail
          title='CodeRabbit Single Directory Diagnostic'
          body_file="$REPORT_DIR/issue-body.md"
          findings_count="$(python3 - <<'PY'
          import json,pathlib
          n=0
          p=pathlib.Path('coderabbit-single-dir-report/stdout.jsonl')
          if p.exists():
            for line in p.read_text(encoding='utf-8', errors='replace').splitlines():
              try: obj=json.loads(line)
              except Exception: continue
              if obj.get('type')=='finding': n+=1
          print(n)
          PY
          )"
          cat > "$body_file" <<EOF
          # CodeRabbit Single Directory Diagnostic

          - Public run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source repo: ${SOURCE_REPO}
          - Target dir: $(cat "$REPORT_DIR/target-dir.txt" 2>/dev/null || true)
          - Base/root: $(cat "$REPORT_DIR/base-sha.txt" 2>/dev/null || true)
          - Head: $(cat "$REPORT_DIR/head-sha.txt" 2>/dev/null || true)
          - Exit code: ${EXIT_CODE:-unknown}
          - Findings count: ${findings_count}

          ## CodeRabbit version
          ```text
          $(cat "$REPORT_DIR/coderabbit-version.txt" 2>/dev/null || true)
          ```

          ## stderr tail
          ```text
          $(cat "$REPORT_DIR/stderr.txt.tail" 2>/dev/null || true)
          ```

          ## stdout tail
          ```text
          $(cat "$REPORT_DIR/stdout.jsonl.tail" 2>/dev/null || true)
          ```
          EOF
          issue="$(gh issue list -R "$SOURCE_REPO" --state all --search "$title in:title" --json number,title --jq '.[] | select(.title == "CodeRabbit Single Directory Diagnostic") | .number' | head -n 1)"
          if [[ -z "$issue" ]]; then gh issue create -R "$SOURCE_REPO" --title "$title" --body-file "$body_file" >/dev/null; else gh issue edit "$issue" -R "$SOURCE_REPO" --body-file "$body_file"; gh issue reopen "$issue" -R "$SOURCE_REPO" || true; fi

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf source "$HOME/.coderabbit" "$REPORT_DIR"
          rm -f ~/.git-credentials
          git config --global --unset-all credential.helper || true
