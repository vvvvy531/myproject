name: Private Source PR Agent

on:
  repository_dispatch:
    types: [private-pr-agent]
  workflow_dispatch:
    inputs:
      source_repo:
        description: Private source repo, e.g. vvvvy531/myproject-source
        required: true
        default: vvvvy531/myproject-source
      pr_number:
        description: Private source PR number
        required: true
      head_sha:
        description: Optional source head SHA for traceability
        required: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: private-pr-agent-${{ github.event_name == 'pull_request' && github.repository || github.event.client_payload.source_repo || inputs.source_repo }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      SOURCE_REPO: ${{ github.event_name == 'pull_request' && github.repository || github.event.client_payload.source_repo || inputs.source_repo }}
      PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number }}
      PR_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.html_url || format('https://github.com/{0}/pull/{1}', github.event.client_payload.source_repo || inputs.source_repo, github.event.client_payload.pr_number || inputs.pr_number) }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.client_payload.head_sha || inputs.head_sha }}

    steps:
      - name: Validate PR payload
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_REPO" in
            ""|*" "*|*".."*|*"//"*)
              echo "Invalid source_repo payload" >&2
              exit 1
              ;;
          esac
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "Invalid pr_number payload" >&2
              exit 1
              ;;
          esac
          echo "Review target: ${SOURCE_REPO}#${PR_NUMBER}"
          echo "PR URL: ${PR_URL}"


      - name: Mark private PR-Agent status pending
        if: github.event_name != 'pull_request' && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          gh api "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context="Public PR-Agent Review" \
            -f description="Review running in public CI" \
            -f target_url="$RUN_URL"

      - name: Checkout public PR
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Checkout private source
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          fetch-depth: 0
          lfs: false
          submodules: recursive
          path: source
          persist-credentials: false

      - name: Install PR-Agent
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install pr-agent

      - name: Validate PR-Agent OpenAI config
        shell: bash
        env:
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_BASE_URL:-}" ]]; then
            echo "OPENAI_BASE_URL repository variable is required" >&2
            exit 1
          fi

      - name: Probe OpenAI-compatible endpoint
        shell: bash
        env:
          OPENAI_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
        run: |
          set +x
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          base = os.environ['OPENAI_BASE_URL'].rstrip('/')
          key = os.environ['OPENAI_KEY']
          model = os.environ['OPENAI_MODEL']
          probe_model = model.removeprefix('openai/')
          def post(path, payload, timeout=60):
              req = urllib.request.Request(
                  base + path,
                  data=json.dumps(payload).encode(),
                  headers={'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'},
                  method='POST',
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, r.read(2048).decode('utf-8', 'replace')
          req = urllib.request.Request(base + '/models', headers={'Authorization': f'Bearer {key}'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = json.loads(r.read().decode('utf-8', 'replace'))
                  ids = [m.get('id') for m in body.get('data', []) if isinstance(m, dict)]
                  print(f"/models ok: {len(ids)} models")
                  print('model sample:', ', '.join(ids[:20]))
          except Exception as e:
              print(f"/models probe failed: {type(e).__name__}")
          try:
              status, body = post('/chat/completions', {
                  'model': probe_model,
                  'messages': [{'role': 'user', 'content': 'Reply with OK only.'}],
                  'max_tokens': 8,
                  'temperature': 0,
              })
              print(f"/chat/completions ok: HTTP {status} for model {probe_model}")
          except urllib.error.HTTPError as e:
              print(f"/chat/completions failed: HTTP {e.code} for model {probe_model}")
              sys.exit(1)
          except Exception as e:
              print(f"/chat/completions failed: {type(e).__name__} for model {probe_model}")
              sys.exit(1)
          PY

      - name: Run PR-Agent review
        working-directory: source
        shell: bash
        env:
          GITHUB__USER_TOKEN: ${{ github.event_name == 'pull_request' && github.token || secrets.PRIVATE_SOURCE_PAT }}
          OPENAI_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          OPENAI__KEY: ${{ secrets.CLIPROXY_API_KEY }}
          OPENAI.API_BASE: ${{ vars.OPENAI_BASE_URL }}
          OPENAI__API_BASE: ${{ vars.OPENAI_BASE_URL }}
          config.model: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          config.weak_model: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          config.fallback_models: "[\"${{ vars.OPENAI_MODEL || 'gpt-5.5' }}\"]"
          config.custom_model_max_tokens: '128000'
          config.ai_timeout: '900'
          config.verbosity_level: '1'
          pr_reviewer.extra_instructions: Focus on Linux build safety, Unreal Engine build issues, CI/CD, release artifacts, shell commands, secrets leakage, permissions, and supply-chain risks. Do not repeat large code blocks.
        run: |
          set +x
          set +e
          max_attempts=3
          pr_agent_status=1
          for attempt in $(seq 1 "$max_attempts"); do
            echo "PR-Agent review attempt ${attempt}/${max_attempts}"
            set -o pipefail
            pr-agent --pr_url "$PR_URL" review 2>&1 | tee pr-agent-review.log
            pipeline_status=(${PIPESTATUS[@]})
            pr_agent_status=${pipeline_status[0]:-1}
            tee_status=${pipeline_status[1]:-1}
            set +o pipefail
            if [[ "$tee_status" -ne 0 ]]; then
              echo "tee failed while capturing PR-Agent output" >&2
              exit "$tee_status"
            fi
            if grep -E "(Failed to review PR|Failed to parse review data|Body cannot be blank|Failed to generate prediction|Error during LLM inference|litellm\.Timeout|Traceback)" pr-agent-review.log >/dev/null; then
              echo "PR-Agent reported an internal LLM/review failure" >&2
              pr_agent_status=1
              [[ $attempt -lt "$max_attempts" ]] && echo "Retrying PR-Agent review in 3s..." && sleep 3
              continue
            fi
            break
          done
          set -e
          exit "$pr_agent_status"


      - name: Mark private PR-Agent status success
        if: success() && github.event_name != 'pull_request' && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          gh api "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="Public PR-Agent Review" \
            -f description="Review completed" \
            -f target_url="$RUN_URL"

      - name: Mark private PR-Agent status failure
        if: failure() && github.event_name != 'pull_request' && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          gh api "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state=failure \
            -f context="Public PR-Agent Review" \
            -f description="Review failed" \
            -f target_url="$RUN_URL"

      - name: Cleanup local runner state
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          rm -rf source
          if [[ -n "${GITHUB_WORKSPACE:-}" && "$GITHUB_WORKSPACE" == *"/_work/"* ]]; then
            rm -rf "$GITHUB_WORKSPACE"/*
            rm -rf "$GITHUB_WORKSPACE"/.[!.]* "$GITHUB_WORKSPACE"/..?* 2>/dev/null || true
          fi
          if [[ -n "${RUNNER_TEMP:-}" && "$RUNNER_TEMP" == *"/_work/"* ]]; then
            rm -rf "$RUNNER_TEMP"/*
            rm -rf "$RUNNER_TEMP"/.[!.]* "$RUNNER_TEMP"/..?* 2>/dev/null || true
          fi
          if [[ -n "${RUNNER_TOOL_CACHE:-}" && "$RUNNER_TOOL_CACHE" == *"/_work/"* ]]; then
            rm -rf "$RUNNER_TOOL_CACHE"/* || true
          fi
          rm -rf ~/.claude/projects ~/.claude/sessions ~/.claude/statsig ~/.claude/todos || true
          rm -f ~/.bash_history ~/.zsh_history ~/.git-credentials || true
          git config --global --unset-all credential.helper || true
