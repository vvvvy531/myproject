name: Private Source PR Agent

on:
  repository_dispatch:
    types: [private-pr-agent]
  workflow_dispatch:
    inputs:
      source_repo:
        description: Private source repo, e.g. vvvvy531/myproject-source
        required: true
        default: vvvvy531/myproject-source
      pr_number:
        description: Private source PR number
        required: true
      head_sha:
        description: Optional source head SHA for traceability
        required: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: private-pr-agent-${{ github.event_name == 'pull_request' && github.repository || github.event.client_payload.source_repo || inputs.source_repo }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      SOURCE_REPO: ${{ github.event_name == 'pull_request' && github.repository || github.event.client_payload.source_repo || inputs.source_repo }}
      PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number }}
      PR_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.html_url || format('https://github.com/{0}/pull/{1}', github.event.client_payload.source_repo || inputs.source_repo, github.event.client_payload.pr_number || inputs.pr_number) }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.client_payload.head_sha || inputs.head_sha }}

    steps:
      - name: Validate PR payload
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_REPO" in
            ""|*" "*|*".."*|*"//"*)
              echo "Invalid source_repo payload" >&2
              exit 1
              ;;
          esac
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "Invalid pr_number payload" >&2
              exit 1
              ;;
          esac
          echo "Review target: ${SOURCE_REPO}#${PR_NUMBER}"
          echo "PR URL: ${PR_URL}"


      - name: Mark private PR-Agent status pending
        if: github.event_name != 'pull_request' && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          gh api "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state=pending \
            -f context="Public PR-Agent Review" \
            -f description="Review running in public CI" \
            -f target_url="$RUN_URL"

      - name: Checkout public PR
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Checkout private source
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          fetch-depth: 0
          lfs: false
          submodules: recursive
          path: source
          persist-credentials: false

      - name: Install PR-Agent
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install pr-agent

      - name: Run PR-Agent review
        working-directory: source
        shell: bash
        env:
          GITHUB__USER_TOKEN: ${{ github.event_name == 'pull_request' && github.token || secrets.PRIVATE_SOURCE_PAT }}
          OPENAI__KEY: ${{ secrets.CLIPROXY_API_KEY }}
          OPENAI__API_BASE: https://cliproxy.boxd.sh/v1
          config.model: openai/review
          config.weak_model: openai/review
          config.fallback_models: '["openai/review"]'
          config.custom_model_max_tokens: '128000'
          config.ai_timeout: '300'
          config.verbosity_level: '1'
          pr_reviewer.extra_instructions: Focus on Linux build safety, Unreal Engine build issues, CI/CD, release artifacts, shell commands, secrets leakage, permissions, and supply-chain risks. Do not repeat large code blocks.
        run: |
          set +x
          pr-agent --pr_url "$PR_URL" review


      - name: Mark private PR-Agent status success
        if: success() && github.event_name != 'pull_request' && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          gh api "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="Public PR-Agent Review" \
            -f description="Review completed" \
            -f target_url="$RUN_URL"

      - name: Mark private PR-Agent status failure
        if: failure() && github.event_name != 'pull_request' && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          gh api "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state=failure \
            -f context="Public PR-Agent Review" \
            -f description="Review failed" \
            -f target_url="$RUN_URL"

      - name: Cleanup checkout
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf source
          rm -f ~/.git-credentials
          git config --global --unset-all credential.helper || true
