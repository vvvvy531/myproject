name: Automated PR Review B

on:
  repository_dispatch:
    types: [private-review-b]
  workflow_dispatch:
    inputs:
      source_repo:
        description: Source repo
        required: true
        default: vvvvy531/myproject-source
      pr_number:
        description: PR number
        required: true
      head_sha:
        description: Optional head SHA
        required: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: review-b-${{ github.event_name == 'pull_request' && github.repository || github.event.client_payload.source_repo || inputs.source_repo }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SOURCE_REPO: ${{ github.event_name == 'pull_request' && github.repository || github.event.client_payload.source_repo || inputs.source_repo }}
      PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number }}
      PR_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.html_url || format('https://github.com/{0}/pull/{1}', github.event.client_payload.source_repo || inputs.source_repo, github.event.client_payload.pr_number || inputs.pr_number) }}
      HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.client_payload.head_sha || inputs.head_sha }}
      ARTIFACT_REPO: vvvvy531/myproject-linux-builds
    steps:
      - name: Validate PR payload
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_REPO" in ""|*" "*|*".."*|*"//"*) echo "Invalid" >&2; exit 1 ;; esac
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "Invalid" >&2; exit 1 ;; esac
          echo "Review target: ${SOURCE_REPO}#${PR_NUMBER}"

      - name: Mark review pending
        if: github.event_name != 'pull_request' && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          gh api "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state=pending -f context="Public PR Review B" \
            -f description="Review in progress" -f target_url="$RUN_URL"

      - name: Checkout public PR
        if: github.event_name == 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Checkout private source
        if: github.event_name != 'pull_request'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.PRIVATE_SOURCE_PAT }}
          fetch-depth: 0
          lfs: false
          submodules: recursive
          path: source
          persist-credentials: false

      - name: Setup review proxy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          API_KEY: ${{ secrets.REVIEW_PROXY_KEY }}
          BASE_URL: ${{ secrets.REVIEW_PROXY_URL }}
          MODEL: ${{ secrets.REVIEW_MODEL || 'gpt-5.5' }}
          ARTIFACT_REPO: ${{ vars.ARTIFACT_REPO || 'vvvvy531/myproject-linux-builds' }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/ci-scripts/setup-proxy.sh?ref=main" \
            > /tmp/_proxy.sh
          bash /tmp/_proxy.sh
          rm -f /tmp/_proxy.sh

      - name: Run review
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
          GITHUB__USER_TOKEN: ${{ github.event_name == 'pull_request' && github.token || secrets.PRIVATE_SOURCE_PAT }}
          PR_URL: ${{ env.PR_URL }}
          REVIEW_KEY: ${{ secrets.REVIEW_PROXY_KEY }}
          REVIEW_URL: ${{ secrets.REVIEW_PROXY_URL }}
          REVIEW_MODEL: ${{ secrets.REVIEW_MODEL || 'gpt-5.5' }}
          ARTIFACT_REPO: vvvvy531/myproject-linux-builds
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO}/contents/ci-scripts/run-pr-review.sh?ref=main" \
            > /tmp/_review.sh
          bash /tmp/_review.sh
          rm -f /tmp/_review.sh

      - name: Mark review success
        if: success() && github.event_name != 'pull_request' && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          gh api "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state=success -f context="Public PR Review B" \
            -f description="Review completed" -f target_url="$RUN_URL"

      - name: Mark review failure
        if: failure() && github.event_name != 'pull_request' && env.HEAD_SHA != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_SOURCE_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +x
          gh api "repos/${SOURCE_REPO}/statuses/${HEAD_SHA}" \
            -f state=failure -f context="Public PR Review B" \
            -f description="Review failed" -f target_url="$RUN_URL"

      - name: Cleanup
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LINUX_BUILDS_PAT }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/${ARTIFACT_REPO:-vvvvy531/myproject-linux-builds}/contents/ci-scripts/cleanup-review.sh?ref=main" \
            > /tmp/_cleanup.sh
          bash /tmp/_cleanup.sh
          rm -f /tmp/_cleanup.sh
